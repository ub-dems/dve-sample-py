# ============================================================
# Build system (PEP 518 / PEP 517)
# ============================================================
[build-system]

# --- [hatch] ---------------------------------------------------

requires = ["hatchling>=1.30.1"]
build-backend = "hatchling.build"

# --- [uv_build] ---------------------------------------------------

#requires = ["uv_build>=0.11.26,<0.12"]
#build-backend = "uv_build"


# ============================================================
# Project metadata (PEP 621)
# ============================================================
[project]
name = "dve_sample_py"
version = "1.0.0"
description = "TODO(title): TITLE OF THE RESEARCH WORK"
readme = "README.md"
license-files = ["LICENSES/*.txt", "LICENSE.md"]
requires-python = ">=3.14,<3.15"

authors = [
  { name = "dsuser/ub-dems", email = "dsuser@campus.unimib.it" },
]

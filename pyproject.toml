  # see: https://pypi.org/classifiers/
  
  # Indicate who your project is intended for
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",

  # "Environment :: GPU :: NVIDIA CUDA",

  # Specify the Python versions you support here.
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  
  # Specify the Licence.
  "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
]

# }}} //
# {{{ ////////////////////////////////////////////////////////////////


# ============================================================
# Dependencies (PEP 508 strings)
# ============================================================
dependencies = [

  # --------------------------------------------------------------------
  # --- ML frameworks ---
  # --------------------------------------------------------------------
  #
  # moved to [project.optional-dependencies]
  # to support both 'gpu' and 'cpu' architectures
  #
  # usage:
  #
  #   uv lock
  #
  #   uv sync --all-groups --extra=gpu  
  # or 
  #   uv sync --all-groups --extra=cpu
  #
  #
  # to detect GPU, in shell:
  #
  # (type nvidia-smi && nvidia-smi -L) &> /dev/null \
  #   && HAS_GPU=1 || HAS_GPU=0; echo $HAS_GPU
  #
  # see:
  # - https://docs.astral.sh/uv/guides/integration/pytorch/
  # - https://zenn.dev/haru256/articles/6ded722b409d13?locale=en
  # - AGENTS.md
  # --------------------------------------------------------------------


  # --- data ---
  "numpy",
  "pandas",
  "pandas-datareader",
  "openpyxl",
  # "h5py",
  "pyarrow",
  "polars",
  "py7zr",

  # --- sql ---
  "SQLAlchemy",
  "psycopg2-binary",
  "mysql-connector-python",
  # "mysqlclient",

  # --- db ---
  "duckdb",

  # --- stats ---
  "scipy",
  "statsmodels",

  # --- plots ---
  "matplotlib",
  "plotly",
  "seaborn",
  "Pillow",
  "geopandas",

  # --- graphs ---
  "graphframes",
  "graphviz",
  "networkx",
  "igraph",
  "pyvis",
  "pydot",

  # --- system ---
  "requests",
  "oauthlib",
  "requests-oauthlib",
  "urllib3",
  "aiohttp",
  "pyzmq",

  "pyyaml",
  "types-pyyaml",
  "toml",
  "types-toml",
  "piny",
  "click",
  "pydantic",
  "pathspec",

  "icecream",
  #"radian",
  "tqdm",

  "pip",
  "packaging",
  "more-itertools",

  # --- git dependency ---
  "rootpath @ git+https://github.com/hute37/python-rootpath@stable",

]


# ============================================================
# Optional dependency groups (PEP 621 Extras)
# ============================================================
[project.optional-dependencies]

cpu = [
  
  "torch==2.10.*",
  "torchvision==0.25.*",

  "keras",
  
]

gpu = [

  "torch==2.10.*",
  "torchvision==0.25.*",

  "keras",

  ### "tensorflow==2.21.*",
  ### "tensorflow-datasets==4.9.*",
  ### "tensorboard",


  ## "pynvml; sys_platform == 'linux'",
  "nvidia-ml-py; sys_platform == 'linux'",

  # Index source: controlled by [[tool.uv.index]] name = "torch-gpu".
  # In GPU environments (dev / test / prod) the index resolves to:
  # https:^//download.pytorch.org/whl/cu130
  # In CI set:
  # UV_INDEX_TORCH_GPU=https:^//download.pytorch.org/whl/cpu
  # to redirect to the CPU wheel server, eliminating triton and all
  # CUDA-bundled libraries from the virtual environment  # "tensorflow==2.20.*",


]



# ===[BUILD]=================================================================

# see: https://packaging.python.org/en/latest/tutorials/packaging-projects/#choosing-a-build-backend

# --- [hatch] ---------------------------------------------------

[tool.hatch.metadata]
allow-direct-references = true


[tool.hatch.build.targets.sdist]
include = [
  "src",
  "/tests/pytest",
]

exclude = [
  "*.tar",
  "*.tar.gz",
  ".cache",
  ".cache/uv",
  "images",
  "node_modules",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dve", "src/vce"]
artifacts = [
  "*.so",
  "!/node_modules/*.so",
]

# --- [uv_build] ---------------------------------------------------

# [tool.uv.build-backend]
# namespace = true
# #module-name = ["vce", "dve"]


# --- [setuptools] ---------------------------------------------------

# [tool.setuptools.packages.find]
# where   = ["src"]
# include = ["*"]

# [tool.setuptools]
# include-package-data = true

# [tool.setuptools.package-data]
# res = ["resources/*", "resources/*/*"]


# ===[TEST]=================================================================

# --- [pytest] ---------------------------------------------------

[tool.pytest.ini_options]
pythonpath = ["src", "tests/pytest"]
testpaths = ["tests/pytest"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

log_cli = true
log_cli_level = "DEBUG"

# ===[LINT]=================================================================

# --- [mypy] ---------------------------------------------------

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

# --- [pyright] ---------------------------------------------------

[tool.pyright]
include = ["src", "tests/pytest", "notebooks"]
exclude = [
  "notebooks/samples/Attic/*",
  "**/*.ipynb",
  "doc/*",
  "home/*",
  "notes/*",
  "renv/*",
  ".venv/*",
  ".agents/*",
  ".eggs/*.py",
  "**/node_modules",
  "**/__pycache__",
  "docker",
  "notes",
  "data",
  "logs",
  "temp",
]
ignore = ["build"]
defineConstant = { DEBUG = true }
typeCheckingMode = "basic"
#typeCheckingMode = "strict"
reportMissingImports = true
#reportMissingTypeStubs = true

# --- [ruff] ---------------------------------------------------

[tool.ruff]
line-length = 120
target-version = "py312"
fix = true

[tool.ruff.lint]
unfixable = []
#ignore-init-module-imports = false
typing-modules = ["pandas._typing"]
exclude = [
  "notebooks/samples/Attic/*",
  "doc/*",
  ".eggs/*.py",
  "home/*",
  "notes/*",
  "renv/*",
  ".venv/*",
  ".agents/*",
]
select = [
  "F",
  "E",
  "W",
  "YTT",
  "B",
  "Q",
  "T10",
  "INT",
  "PL",
  "PT",
  "PIE",
  "PYI",
  "TID",
  "ISC",
  "TCH",
  "C4",
  "PGH",
  "RUF",
  "S102",
  "NPY002",
  "PERF",
  "FLY",
  "G",
  "FA",
  "ICN001",
  "SLOT",
  "RSE",
]
ignore = ["C408", "PLR0913", "PLR0917"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
combine-as-imports = true
#split-on-trailing-comma  = false


[tool.ruff.format]
docstring-code-format = true
exclude = [
  "notebooks/samples/Attic/*",
  "notebooks/*",
  "doc/*",
  ".eggs/*.py",
  "home/*",
  "notes/*",
  "renv/*",
  ".venv/*",
  ".agents/*",
]

# --- [jupytext] ------------------------------------------------

[tool.jupytext]
formats = "ipynb,py:percent"


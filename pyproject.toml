# ============================================================
# Tool configuration (non-standard, tool-specific tables)
# ============================================================

# ===[ENV]=================================================================

# --- [uv] ---------------------------------------------------

[tool.uv]
# Treat this directory as an installable package
package = true

# Prevent both "cpu" and "gpu" from being specified at the same time
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]

[tool.uv.sources]
packaging = { index = "pypi" }

torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-gpu", extra = "gpu" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-gpu", extra = "gpu" },
]

### [tool.uv.environment]
### # For CI: Force CPU-only
### UV_INDEX_TORCH_GPU = { value = "https://download.pytorch.org/whl/cpu", if = "'CI' in os.environ" }
### UV_EXTRA_INDEX_URL = { value = "https://download.pytorch.org/whl/cpu", if = "'CI' in os.environ" }

[[tool.uv.index]]
name = "pypi"
url = " https://pypi.org/simple"
explicit = false


[[tool.uv.index]]
# GPU default: CUDA 13.0-compiled wheels (driver ^>= 580).
# Rename from "torch130" to "torch-gpu" so the uv env-var override reads:
# UV_INDEX_TORCH_GPU=<url>
name = "pytorch-gpu"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true



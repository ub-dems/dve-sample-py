########################################################################
### Project Runtime Configuration
### --------------------------------------------------------------------
### @see:
### - pyproject.toml#tool.local.config
### - dve.config.conf.cfg()
### - dve.config.conf.app_config
### - vce.config.conf.app_config
### - dve.config.conf.db
### - vce.config.conf.db
########################################################################

meta:
  project: dve-sample-py
  package: dve

data:

  db:

    dve:
      alias: dve_lt

    dve_lt:

      type: sqlite
      driver: pysqlite

      pool:
        name: "dve"
        size: 3

      database: ${X_DB_DEMO_DATABASE:-dve}
      path: ${X_DB_DEMO_PATH:-data/ext/dbms}

      uri: "{type}+{driver}:///{path}/{database}.db"

      # host: ${X_DB_DEMO_HOST:-localhost}
      # port: ${X_DB_DEMO_PORT:-3306}
      # user: ${X_DB_DEMO_USER:-demo}
      # password: ${X_DB_DEMO_PASSWORD:-<Sec3et!>}
      # database: ${X_DB_DEMO_DATABASE:-demo}

      # uri: "{type}+{driver}://{user}:{password}@{host}:{port}/{database}"


    dve_my:

      type: mysql
      driver: mysqlconnector
      # driver: mysqldb

      pool:
        name: "dve"
        size: 3

      host: ${X_DB_DVE_HOST:-localhost}
      port: ${X_DB_DVE_PORT:-3306}
      user: ${X_DB_DVE_USER:-dve}
      password: ${X_DB_DVE_PASSWORD:-*hidden*}
      database: ${X_DB_DVE_DATABASE:-dve}

      uri: "{type}+{driver}://{user}:{password}@{host}:{port}/{database}"


    demo:
      alias: demo_lt

    demo_lt:

      type: sqlite
      driver: pysqlite

      pool:
        name: "demo_lt"
        size: 3

      database: ${X_DB_DEMO_DATABASE:-demo}
      path: ${X_DB_DEMO_PATH:-data/ext/test/demo}

      uri: "{type}+{driver}:///{path}/{database}.db"

      # host: ${X_DB_DEMO_HOST:-localhost}
      # port: ${X_DB_DEMO_PORT:-3306}
      # user: ${X_DB_DEMO_USER:-demo}
      # password: ${X_DB_DEMO_PASSWORD:-<Sec3et!>}
      # database: ${X_DB_DEMO_DATABASE:-demo}

      # uri: "{type}+{driver}://{user}:{password}@{host}:{port}/{database}"


    demo_my:

      type: mysql
      driver: mysqlconnector
      # driver: mysqldb

      pool:
        name: "demo_my"
        size: 3

      host: ${X_DB_DEMO_HOST:-localhost}
      port: ${X_DB_DEMO_PORT:-3306}
      user: ${X_DB_DEMO_USER:-demo}
      password: ${X_DB_DEMO_PASSWORD:-<Sec3et!>}
      database: ${X_DB_DEMO_DATABASE:-demo}

      uri: "{type}+{driver}://{user}:{password}@{host}:{port}/{database}"


    demo_pg:

      type: postgresql
      driver: psycopg2

      pool:
        name: "demo_my"
        size: 3

      host: ${X_DB_DEMO_HOST:-localhost}
      port: ${X_DB_DEMO_PORT:-5432}
      user: ${X_DB_DEMO_USER:-demo}
      password: ${X_DB_DEMO_PASSWORD:-<Sec3et!>}
      database: ${X_DB_DEMO_DATABASE:-demo}

      uri: "{type}://{user}:{password}@{host}:{port}/{database}"

test:

  dummy_script:

    filename: "test_one-1k.csv" # see: "dummy_script.py"

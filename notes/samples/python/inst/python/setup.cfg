[metadata]
name = dve_sample_r
version = 2.0.0a1
author = Datalab DEMS
author_email = datalab@unimib.it
description = R Template Project with Docker API Service and Jupyter Support
long_description = file: README.md
long_description_content_type = text/x-rst
url = https://gitlab.com/ub-dems/ds-labs/dve-sample-r
project_urls =
    Bug Tracker = https://gitlab.com/ub-dems/ds-labs/dve-sample-r/-/issues
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
package_dir =
    = src
zip_safe = True
include_package_data = True
packages = find:
python_requires = >=3.8

install_requires =
    cv2
    py
    numpy
    rootpath
    pandas
    flask

tests_require =
    colorama
    mock
    pytest
    attrs
    more-itertools
    six

entry_points =
    [console_scripts]
    dve = dve.cli:main

[options.packages.find]
where = src

[options.package_data]
res = resources/*, resources/*/*

[flake8]
max-line-length = 88
extend-ignore = E203, W503

[tool:pytest]
minversion = 6.0
addopts = -ra -q
testpaths =
    tests
    

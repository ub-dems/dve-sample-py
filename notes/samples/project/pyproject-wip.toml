[project]
name = "obs"
version = "0.1.0"
description = "Obsidian Markdown aggregation tools for NotebookLM"
readme = "README.md"
authors = [
    { name = "datalab", email = "datalab@unimib.it" }
]
requires-python = ">=3.12"

# {{{ ////////////////////////////////////////////////////////////////

dependencies = [
    "click>=8.1.7",
    "pyyaml>=6.0.1",
    "pathspec>=0.11.0",
    "toml>=0.10.2",
    "icecream>=2.1.3",
]

# }}} //

# {{{ ////////////////////////////////////////////////////////////////

# [project.optional-dependencies]
[dependency-groups]
dev = [
    "pytest>=7.4.3",
    "pytest-mock>=3.12.0",
    "mypy>=1.7.1",
    "ruff>=0.1.6",
    "pyright>=1.1.338",
    "types-pyyaml>=6.0.12",
    "types-toml>=0.10.8",
    "behave",
]


# }}} //



# {{{ ////////////////////////////////////////////////////////////////

[project.scripts]
obs = "obs.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/main/python/obs"]

[tool.hatch.build.targets.wheel.sources]
# Map the Maven directory to the root of the package
"src/main/python" = ""

[tool.pytest.ini_options]
pythonpath = [
    "src/main/python",
    "src/test/python"
]
testpaths = ["src/test/python"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

# }}} //

# {{{ ////////////////////////////////////////////////////////////////

[tool.ruff]
src = ["src/main/python"]
line-length = 100
indent-width = 4
target-version = "py310"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = [
    "F",   # pyflakes
    "E",   # pycodestyle
    "I",   # isort
    "N",   #
    "W",   #
    "UP",  #
    "ANN", # flake8 type annotations
    "RUF", # ruff-specific rules
]
fixable = ["ALL"]
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
mypy_path = "src/main/python"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict = true


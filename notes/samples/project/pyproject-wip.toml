[project]
name = "dve_sample_py"
version = "2.1.0a1"
description = "Python Template Project with Podman and Jupyter Support"
authors = [
    {name = "Datalab DEMS", email = "datalab@unimib.it"},
]
# AFL 3.0 has no SPDX identifier; using text form per PEP 621 §3.3
license = {text = "Academic Free License (AFL) v. 3.0"}
readme = "README.md"
requires-python = ">=3.10,<3.15"

# URLs moved from [tool.poetry] to [project.urls] per PEP 621 §3.12
[project.urls]
Documentation = "https://gitlab.com/ub-dems/ds-labs/dve-sample-py/-/wikis/home"
Homepage      = "https://gitlab.com/ub-dems/ds-labs/dve-sample-py"
Repository    = "https://gitlab.com/ub-dems/ds-labs/dve-sample-py.git"

[project.scripts]
main  = "dve.cli:main"
demo  = "vce.cli:main"
hello = "dve.scripts.dummy.dummy_script:main"

# ---------------------------------------------------------------------------
# Runtime dependencies (formerly [tool.poetry.dependencies])
# torch/torchvision index pins are in [tool.uv.sources] below
# ---------------------------------------------------------------------------
[project.dependencies]
# git dependency — PEP 508 direct-reference syntax
rootpath           = {git = "https://github.com/hute37/python-rootpath", branch = "stable"}

# tensorflow stack
tensorboard        = "*"
tensorflow-hub     = "*"
tensorflow-datasets = "*"

# torch (version pins kept; index source resolved via [tool.uv.sources])
torch              = "==2.10.*"
torchvision        = "==0.25.*"

# data
numpy              = "*"
pandas             = "*"
pynvml             = "*"
nvidia-ml-py       = "*"
pandas-datareader  = "*"
openpyxl           = "*"
h5py               = "*"
pyarrow            = "*"
polars             = "*"
SQLAlchemy         = "*"
mysql-connector-python = "*"
mysqlclient        = "*"
psycopg2-binary    = "*"

# stat / math
scipy              = "*"
sympy              = "*"

# graphics
matplotlib         = "*"
plotly             = "*"
seaborn            = "*"
Pillow             = "*"
graphframes        = "*"
graphviz           = "*"
networkx           = "*"
igraph             = "*"
pyvis              = "*"
pydot              = "*"

# system / config / CLI
requests           = "*"
oauthlib           = "*"
requests-oauthlib  = "*"
urllib3            = "*"
pyzmq              = "*"
pyyaml             = "*"
piny               = "*"
toml               = "*"
click              = "*"
icecream           = "*"
radian             = "*"
tqdm               = "*"
pip                = "*"

# lang
more-itertools     = "*"

# ---------------------------------------------------------------------------
# Dev / optional dependencies (formerly [tool.poetry.group.dev.dependencies])
# ---------------------------------------------------------------------------
[project.optional-dependencies]
dev = [
    # jupyter core
    "jupyter",
    "jupyter-core",
    "jupyter-console",
    "jupyter-lsp",
    "notebook",
    "jupyterlab",
    "jupytext",
    "jupyterlab-lsp",
    "nodeenv",
    "nodejs",
    # LSP
    "pyright",
    "python-lsp-server[yapf,rope,pyflakes]",
    "python-lsp-black",
    "black[jupyter]",
    "lux-api",
    # kernels / console
    "ipykernel",
    "ipython",
    "ipython-bg",
    # testing
    "pytest",
    "pytest-flask",
    "pytest-cov",
    "unittest2",
    "coverage",
    "mock",
    "nose",
    # linting / formatting (legacy tools kept for compatibility)
    "pylint",
    "flake8",
    "pyproject-flake8",
    "jedi",
    "autopep8",
    "yapf",
    "isort",
    "pipreqs",
    "ruff",
    # docs
    "sphinx",
    "nbsphinx",
    "sphinx-autoapi",
    "sphinx-rtd-theme",
    # misc
    "colorama",
    "py",
    "mypy",
    # release tooling
    "setuptools",
    "wheel",
    "bumpversion",
    "twine",
]

# ---------------------------------------------------------------------------
# Setuptools: src-layout package discovery (replaces [tool.poetry] packages)
# ---------------------------------------------------------------------------
[tool.setuptools.packages.find]
where   = ["src"]
include = ["*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
res = ["resources/*", "resources/*/*"]

# ---------------------------------------------------------------------------
# uv index declarations (forward-compatible; inert to Poetry)
# [[tool.poetry.source]] entries are retained below for Poetry compatibility
# ---------------------------------------------------------------------------
[tool.uv.sources]
# Route torch/torchvision to the CUDA 13.0 wheel index
torch       = {index = "torch130"}
torchvision = {index = "torch130"}

[[tool.uv.index]]
name     = "torch121"
url      = "https://download.pytorch.org/whl/cu121"
explicit = true

[[tool.uv.index]]
name     = "torch124"
url      = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name     = "torch130"
url      = "https://download.pytorch.org/whl/cu130"
explicit = true

# ---------------------------------------------------------------------------
# Poetry source declarations retained for backward compatibility
# ---------------------------------------------------------------------------
[[tool.poetry.source]]
name     = "torch121"
url      = "https://download.pytorch.org/whl/cu121"
priority = "explicit"

[[tool.poetry.source]]
name     = "torch124"
url      = "https://download.pytorch.org/whl/cu124"
priority = "explicit"

[[tool.poetry.source]]
name     = "torch130"
url      = "https://download.pytorch.org/whl/cu130"
priority = "explicit"

# ---------------------------------------------------------------------------
# Build system — Poetry backend retained (Step 1)
# ---------------------------------------------------------------------------
[build-system]
requires      = ["poetry-core>=2.0", "setuptools", "wheel"]
build-backend = "poetry.core.masonry.api"

# ---------------------------------------------------------------------------
# Tool configuration (unchanged from source)
# ---------------------------------------------------------------------------

[tool.pyright]
include = ["src", "tests/pytest", "notebooks"]
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "docker",
    "notes",
    "data",
    "logs",
    "temp",
]
ignore              = ["build"]
defineConstant      = {DEBUG = true}
typeCheckingMode    = "basic"
reportMissingImports = true

[tool.pytest.ini_options]
pythonpath   = ["src", "tests/pytest"]
testpaths    = ["tests/pytest"]
python_files = ["test_*.py"]
python_classes  = ["Test*"]
python_functions = ["test_*"]
addopts      = "-v --tb=short"

[tool.isort]
profile = "black"

[tool.black]
line-length    = 88
target-version = ["py310"]
include        = '\.pyi?$'
exclude        = '''
(
  /(
      \.eggs | \.git | \.hg | \.mypy_cache | \.tox | \.venv
    | _build | buck-out | build | dist
  )/
  | foo.py
)
'''

[tool.ruff]
line-length    = 88
target-version = "py310"
fix            = true

[tool.ruff.lint]
unfixable      = []
typing-modules = ["pandas._typing"]
exclude = [
    "doc/sphinxext/*.py",
    "doc/build/*.py",
    "doc/temp/*.py",
    ".eggs/*.py",
    "pandas/util/version/*",
    "pandas/io/clipboard/__init__.py",
    "env",
]
select = [
    "F","E","W","YTT","B","Q","T10","INT","PL","PT","PIE","PYI",
    "TID","ISC","TCH","C4","PGH","RUF","S102","NPY002","PERF",
    "FLY","G","FA","ICN001","SLOT","RSE",
]
ignore = []

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
combine-as-imports       = true
split-on-trailing-commas = false

[tool.ruff.format]
docstring-code-format = true


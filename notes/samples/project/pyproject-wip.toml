# ============================================================
# Project metadata (PEP 621)
# ============================================================
[project]
name = "dve_sample_py"
version = "2.1.0a1"
description = "Reproducible experiments for [Paper Title]"
readme = "README.md"
license = { file = "LICENCE.md" }
requires-python = ">=3.10,<3.15"

authors = [
    {name = "Datalab DEMS", email = "datalab@unimib.it"},
]

[project.urls]
Documentation = "https://gitlab.com/ub-dems/ds-labs/dve-sample-py/-/wikis/home"
Homepage      = "https://gitlab.com/ub-dems/ds-labs/dve-sample-py"
Repository    = "https://gitlab.com/ub-dems/ds-labs/dve-sample-py.git"

[project.scripts]
main  = "dve.cli:main"
demo  = "vce.cli:main"
hello = "dve.scripts.dummy.dummy_script:main"


# ============================================================
# Project Custom Configuration
# ============================================================

[tool.dve]
has_config = true

[tool.dve.paths]
log_dir = "logs"

[tool.dve.log]
level = "INFO"

[tool.dve.hello]
salutation = "Hi"


# ============================================================
# Build system (PEP 518 / PEP 517)
# ============================================================
[build-system]
##@(uv): requires = ["hatchling>=1.21"]
##@(uv): build-backend = "hatchling.build"
requires = [
    "poetry-core>=2.0",
    "setuptools",
    "wheel",
    "incremental",
]
build-backend = "poetry.core.masonry.api"


# ============================================================
# Dependencies (PEP 508 strings)
# ============================================================
dependencies = [

  # --- ML frameworks ---
  "tensorboard",
  "tensorflow-hub",
  "tensorflow-datasets",

  "torch==2.10.* @ https://download.pytorch.org/whl/cu130/torch",
  "torchvision==0.25.* @ https://download.pytorch.org/whl/cu130/torchvision",

  # --- data ---
  "numpy",
  "pandas",
  "pandas-datareader",
  "openpyxl",
  "h5py",
  "pyarrow",
  "polars",

  # --- sql ---
  "SQLAlchemy",
  "mysql-connector-python",
  "mysqlclient",
  "psycopg2-binary",

  # --- stats ---
  "scipy",
  "sympy",

  # --- graphics ---
  "matplotlib",
  "plotly",
  "seaborn",
  "Pillow",

  "graphframes",
  "graphviz",
  "networkx",
  "igraph",
  "pyvis",
  "pydot",

  # --- system ---
  "requests",
  "oauthlib",
  "requests-oauthlib",
  "urllib3",
  "pyzmq",

  "pyyaml",
  "types-pyyaml",
  "toml",
  "types-toml",
  "click",
  "pathspec",

  "icecream",
  "radian",
  "tqdm",

  "pip",
  "more-itertools",

  # --- GPU monitoring ---
  "pynvml==*; sys_platform == 'linux'",
  "nvidia-ml-py==*; sys_platform == 'linux'",

  # --- git dependency ---
  "rootpath @ git+https://github.com/hute37/python-rootpath@stable",

]


# ============================================================
# Optional dependency groups
# ============================================================
[project.optional-dependencies]

dev = [

  # --- jupyter ---
  "jupyter",
  "jupyter-core",
  "jupyter-console",
  "jupyter-lsp",
  "notebook",
  "jupyterlab",
  "jupytext",
  "jupyterlab-lsp",

  "nodeenv",
  "nodejs",

  "pyright",
  "python-lsp-server[yapf,rope,pyflakes]",
  "python-lsp-black",

  "black[jupyter]",

  "lux-api",

  "ipykernel",
  "ipywidgets",
  "ipython",
  "ipython-bg",

  # --- test ---
  "pytest",
  "pytest-cov",
  "behave",
  "mock",
  "nose",

  # --- lint ---
  "yapf",
  "ruff",

  # --- docs ---
  # "sphinx",
  # "nbsphinx",
  # "sphinx-autoapi",
  # "sphinx-rtd-theme",

  # --- misc ---
  "colorama",
  "py",
  "mypy",

  # --- packaging ---
  "setuptools",
  "wheel",
  "bumpversion",
  "twine"
]




# ============================================================
# Tool configuration (non-standard, tool-specific tables)
# ============================================================

# --- [uv] ---------------------------------------------------

[tool.uv]
# Treat this directory as an installable package
package = true


[tool.hatch.build.targets.wheel]
#packages = ["src/dve"]

# --- [poetry] ---------------------------------------------------

[tool.poetry]
requires-poetry = ">=2.0"
packages = [{ include = "*", from = "src" }]

# --- [setuptools] ---------------------------------------------------

# [tool.setuptools.packages.find]
# where   = ["src"]
# include = ["*"]

# [tool.setuptools]
# include-package-data = true

# [tool.setuptools.package-data]
# res = ["resources/*", "resources/*/*"]


# --- [pytest] ---------------------------------------------------

[tool.pytest.ini_options]
pythonpath   = ["src", "tests/pytest"]
testpaths    = ["tests/pytest"]
python_files = ["test_*.py"]
python_classes  = ["Test*"]
python_functions = ["test_*"]
addopts      = "-v --tb=short"



# --- [mypy] ---------------------------------------------------

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true


# --- [pyright] ---------------------------------------------------

[tool.pyright]
include = ["src", "tests/pytest", "notebooks"]
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "docker",
    "notes",
    "data",
    "logs",
    "temp",
]
ignore              = ["build"]
defineConstant      = {DEBUG = true}
typeCheckingMode    = "basic"
reportMissingImports = true


# --- [ruff] ---------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py310"
fix            = true

[tool.ruff.lint]
unfixable      = []
typing-modules = ["pandas._typing"]
exclude = [
    "doc/sphinxext/*.py",
    "doc/build/*.py",
    "doc/temp/*.py",
    ".eggs/*.py",
    "pandas/util/version/*",
    "pandas/io/clipboard/__init__.py",
    "env",
]
select = [
    "F","E","W","YTT","B","Q","T10","INT","PL","PT","PIE","PYI",
    "TID","ISC","TCH","C4","PGH","RUF","S102","NPY002","PERF",
    "FLY","G","FA","ICN001","SLOT","RSE",
]
ignore = []

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
combine-as-imports       = true
split-on-trailing-commas = false

[tool.ruff.format]
docstring-code-format = true
















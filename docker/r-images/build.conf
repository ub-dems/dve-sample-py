##
#  /etc/build.conf: build-time environment configuration
#

# ---(build debug)---------------------------

Y_DEBUG=0
#Y_DEBUG_ENV=0  # Dockerfile ARG: Y_DEBUG_ENV

# //////////////////////////////////////////////////
# /// BASE
# //////////////////////////////////////////////////

# ---(podman support)---------------------------

Y_BASE_INIT_APPLY=1
Y_BASE_INIT_USERCONF=1
Y_BASE_INIT_RSTUDIO=1
Y_BASE_INIT_HOME=1
Y_BASE_INIT_CHECK=1

# ---(environ)---------------------------

Y_BASE_ENV_APPLY=1

# Y_BASE_ENV_TZ='Europe/Rome'   # Dockerfile ARG: TZ_SET

# see: base.Dokerfile ARG: Y_LC_*, Y_LANG*

# Y_LANG="en_US.UTF-8"
# Y_LANGUAGE="en_US.UTF-8"
# Y_LC_CTYPE="en_GB.UTF-8"
# Y_LC_NUMERIC="en_GB.UTF-8"
# Y_LC_TIME="en_GB.UTF-8"
# Y_LC_COLLATE="en_GB.UTF-8"
# Y_LC_MONETARY="it_IT.UTF-8"
# Y_LC_MESSAGES="en_GB.UTF-8"
# Y_LC_PAPER="en_GB.UTF-8"
# Y_LC_NAME="en_GB.UTF-8"
# Y_LC_ADDRESS="en_GB.UTF-8"
# Y_LC_TELEPHONE="en_GB.UTF-8"
# Y_LC_MEASUREMENT="en_GB.UTF-8"
# Y_LC_IDENTIFICATION="en_GB.UTF-8"
# Y_LC_ALL="en_GB.UTF-8"

# TZ=Europe/Rome




# //////////////////////////////////////////////////
# /// COMMONS
# //////////////////////////////////////////////////

# ---(clean up)---------------------------

Y_BASE_CLEAN_ALL=1


# ---(upgrade)---------------------------

Y_BASE_COMMONS_UPGRADE=1

# ---(commons)---------------------------

Y_BASE_COMMONS_INSTALL=1
Y_BASE_COMMONS_UNMINIMIZE=0
Y_BASE_COMMONS_LOCALE=1
Y_BASE_COMMONS_MIN=1
Y_BASE_COMMONS_DEV=1
Y_BASE_COMMONS_SYS=1
Y_BASE_COMMONS_X=1
Y_BASE_COMMONS_FONTS=1
Y_BASE_COMMONS_LATEX=1
Y_BASE_COMMONS_CRAN=1
Y_BASE_COMMONS_MOUNTS=1
Y_BASE_COMMONS_CHECK=1


# ---(utils)---------------------------

Y_BASE_UTILS_INSTALL=1
Y_BASE_UTILS_SYS=1
Y_BASE_UTILS_CRAN=1
Y_BASE_UTILS_CHECK=1

# ---(apps)---------------------------

Y_BASE_APPS_EMACS=1
Y_BASE_APPS_STARSHIP=1
Y_BASE_APPS_CURSOR=1
Y_BASE_APPS_ANTIGRAVITY=1


# //////////////////////////////////////////////////
# /// USER
# //////////////////////////////////////////////////

# ---(globals)---------------------------

Y_US_ANY_SUPPORT=1

# ---(home)---------------------------

Y_US_HOME_SUPPORT=1
Y_US_HOME_XDG=1
Y_US_HOME_SSH=1
Y_US_HOME_GIT=1
Y_US_HOME_BASH=1
Y_US_HOME_ZSH=1
Y_US_HOME_EMACS=1
Y_US_HOME_CURSOR=1
Y_US_HOME_ANTIGRAVITY=1


# //////////////////////////////////////////////////
# /// R
# //////////////////////////////////////////////////

# ---(globals)---------------------------

Y_RE_ANY_SUPPORT=1

# ---(seal)---------------------------

Y_RE_PKGS_USER="local"

Y_RE_SEAL_SUPPORT=1
Y_RE_SEAL_ENVIRON=1
Y_RE_SEAL_CHECK=1


# ---(renv)---------------------------

Y_RE_RENV_SUPPORT=1
Y_RE_RENV_INSTALL=1
Y_RE_RENV_RESTORE=1
Y_RE_RENV_UPGRADE=1



# //////////////////////////////////////////////////
# /// PYTHON
# //////////////////////////////////////////////////

# ---(globals)---------------------------

Y_PY_ANY_SUPPORT=1

# Y_PY_PYTHON_VERSION: .python-version 
# Y_PY_PYTHON_VERSION=3.12.3

# @see: https://nodejs.org/en/download 
Y_PY_NODE_VERSION=24.21

#Y_PY_MODE: uv Makefile default
#Y_PY_MODE=uv 
#Y_PY_MODE=poetry



# ---(base)---------------------------

Y_PY_BASE_SUPPORT=1
Y_PY_BASE_VANILLA=1
Y_PY_BASE_UNDO=1
Y_PY_BASE_CHECK=1

# ---(system)---------------------------

Y_PY_SYSTEM_SUPPORT=0
Y_PY_SYSTEM_INSTALL=1
Y_PY_SYSTEM_UPDATE=1
Y_PY_SYSTEM_UPGRADE=1
Y_PY_SYSTEM_CHECK=1


# ---(uv)---------------------------

Y_PY_UV_SUPPORT=1
Y_PY_UV_INSTALL=1
Y_PY_UV_UPGRADE=1
Y_PY_UV_DEFAULT=1
Y_PY_UV_EXTRAS=1
Y_PY_UV_CONFIG=1
Y_PY_UV_PYTHON=1
Y_PY_UV_CHECK=1
Y_PY_UV_DEBUG=0


# ---(pyenv)---------------------------

Y_PY_PYENV_SUPPORT=0
Y_PY_PYENV_INSTALL=1
Y_PY_PYENV_UPGRADE=1
Y_PY_PYENV_DEFAULT=1
Y_PY_PYENV_EXTRAS=1
Y_PY_PYENV_CONFIG=1
Y_PY_PYENV_PYTHON=1
Y_PY_PYENV_CHECK=1
Y_PY_PYENV_DEBUG=0


# ---(poetry)---------------------------

Y_PY_POETRY_SUPPORT=0
Y_PY_POETRY_INSTALL=1
Y_PY_POETRY_CONFIG=1
Y_PY_POETRY_LOAD=1
Y_PY_POETRY_CHECK=1
Y_PY_POETRY_DEBUG=0


# ---(reticulate)---------------------------

Y_PY_RETICULATE_SUPPORT=1
Y_PY_RETICULATE_INSTALL=1
Y_PY_RETICULATE_CONFIG=1
Y_PY_RETICULATE_CHECK=1

# ---(jupyter)---------------------------

Y_PY_JUPYTER_SUPPORT=1
Y_PY_JUPYTER_INSTALL=1
Y_PY_JUPYTER_SYSTEM=0
Y_PY_JUPYTER_HUB=0
Y_PY_JUPYTER_IRKERNEL=1
Y_PY_JUPYTER_LANGSERV=1
Y_PY_JUPYTER_CONFIG=1
Y_PY_JUPYTER_CHECK=1

# //////////////////////////////////////////////////
# /// JULIA
# //////////////////////////////////////////////////

# ---(globals)---------------------------

Y_JU_ANY_SUPPORT=1

Y_JU_JULIA_VERSION=latest


# ---(rust)---------------------------

Y_JU_JULIA_SUPPORT=1
Y_JU_JULIA_INSTALL=1
Y_JU_JULIA_CONFIG=1
Y_JU_JULIA_R_PKGS=1
Y_JU_JULIA_APPS=1
Y_JU_JULIA_KERNEL=1
Y_JU_JULIA_CHECK=1


# //////////////////////////////////////////////////
# /// NODE
# //////////////////////////////////////////////////

# ---(globals)---------------------------

Y_JS_ANY_SUPPORT=1

Y_JS_NODE_VERSION=22.12

# ---(node)---------------------------

Y_JS_NODE_SUPPORT=1
Y_JS_NODE_INSTALL=1
Y_JS_NODE_PKGS=1
Y_JS_NODE_CONFIG=1
Y_JS_NODE_CHECK=1

# ---(code)---------------------------

Y_JS_CODE_SUPPORT=1
Y_JS_CODE_INSTALL=1
Y_JS_CODE_CONFIG=1
Y_JS_CODE_CHECK=1


# //////////////////////////////////////////////////
# /// RUST
# //////////////////////////////////////////////////

# ---(globals)---------------------------

Y_RS_ANY_SUPPORT=1

# ---(rust)---------------------------

Y_RS_RUST_SUPPORT=1
Y_RS_RUST_INSTALL=1
Y_RS_RUST_CONFIG=1
Y_RS_RUST_APPS=1
Y_RS_RUST_CHECK=1



# =============================================================================
# .gitlab-ci.yml
#
# Shared release pipeline for the dve-simple-py codebase.
# This exact file lives in both projects:
#   - ub-dems/dve-simple-py        (private downstream fork, branches main/development)
#   - ub-dems-public/dve-simple-py (public upstream, branch main)
#
# The pipeline is tag-triggered (v*.*.*) and splits into two cooperating
# pipeline RUNS in two different projects:
#   1. Downstream validates, opens the release MR, and (on manual approval)
#      merges + tags upstream.
#   2. Creating that tag on upstream via the API starts a SECOND, independent
#      pipeline in the upstream project, which builds, pushes, mirrors, and
#      notifies.
# =============================================================================
---
spec:
  inputs:
    gd-release-op-upstream-merge:
      default: '1'
    gd-release-op-upstream-image:
      default: '0'
    gd-release-op-upstream-notify:
      default: '0'
    gd-downstream-project:
      default: "ub-dems/vs-base/dve-sample-py"
    gd-upstream-project:
      default: "ub-dems/ds-labs/dve-sample-py"
    gd-upstream-project-enc:
      default: "ub-dems%2Fds-labs%2Fdve-sample-py"
    gd-downstream-project-head:
      default: "develop"
    gd-downstream-project-main:
      default: "main"
    gd-upstream-project-main:
      default: "main"
    gd-version-schema:
      default: '^\d\.\d+(\.\d+)?$'
    gd-python-version:
      default: '3.14'
    gd-dotenv-file:
      default: '.env'
    gd-dotenv-strict:
      default: '.env.exported'
    gd-dotenv-default:
      default: '.env.defaults'
    gd-dotenv-has-config:
      default: '0'
    gd-dotenv-config-url:
      default: "https://gitlab.com/ub-dems/vs-base/dve-sample-py-conf.git"
    gd-dotenv-config-branch:
      default: "main"
    gd-dotenv-config-path:
      default: "../conf"
    gd-lang-op-python:
      default: '1'
    gd-debug-pipeline:
      default: '0'
    environment:
      options:
        - development
        - testing
        - staging
        - production
      default: development
---

stages:
  - config
  - debug
  - lint
  - test
  - build
  - merge
  - release
  - publish


default:
  # see: https://docs.gitlab.com/ci/runners/hosted_runners/linux/
  tags:
    - saas-linux-small-amd64
    # - saas-linux-medium-amd64
    # - saas-linux-large-amd64
    # - saas-linux-xlarge-amd64
    # - saas-linux-2xlarge-amd64
    # - saas-linux-medium-amd64-gpu-standard

  image: python:$[[ inputs.gd-python-version ]]-slim
  # CUDA images:
  # - nvcr.io/nvidia/cuda:12.1.1-base-ubuntu22.04
  # - https://youtu.be/tElegG4NCZ0?si=ZRk01nBHpLjKjoeB


variables:

  # ---------------------------------------------------------------------------
  # SECRETS (CI/CD only)
  # ---------------------------------------------------------------------------
  # The following are pre-configured project CI/CD variables
  # and are intentionally NOT redeclared here:
  #
  # = GitLab API ==============================
  # - GS_DOWNSTREAM_TOKEN
  # - GS_UPSTREAM_TOKEN
  #
  # = Podman Public Registry ==============================
  # - GS_REGISTRY_URL
  # - GS_REGISTRY_USER
  # - GS_REGISTRY_PASSWORD
  #
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # DOTENV (CI/CD + Local Development + Application Runtime)
  # ---------------------------------------------------------------------------
  # The following are .env variables taken from:
  #
  # 1. "Internal Mode": .env-defaults:
  #    if local resources or resources with external auth (Azure)
  #
  # 2. "External Mode": ../conf/.env:
  #     with parallel ckeckout of a (private) configuration project
  #
  # = Podman Private Registry (Azure) ==============================
  # - ACR_RESOURCE
  # - ACR_REGISTRY
  #
  # ---------------------------------------------------------------------------


  # ---------------------------------------------------------------------------
  # VARIABLES (inputs)
  # ---------------------------------------------------------------------------
  # Non-sensitive defaults only.
  #
  # ---------------------------------------------------------------------------
  
  DOWNSTREAM_PROJECT_PATH: "$[[ inputs.gd-downstream-project ]]"
  UPSTREAM_PROJECT_PATH: "$[[ inputs.gd-upstream-project ]]"
  UPSTREAM_PROJECT_PATH_ENCODED: "$[[ inputs.gd-upstream-project-enc ]]"
  MR_SOURCE_BRANCH: "$[[ inputs.gd-downstream-project-main ]]"
  MR_TARGET_BRANCH: "$[[ inputs.gd-upstream-project-main ]]"
  GIT_DEPTH: "0"

  # ---------------------------------------------------------------------------
  # Disk-budget notes
  # ---------------------------------------------------------------------------
  # GitLab SaaS shared runners carry a 20 GB working-directory quota.
  # The CUDA-bundled torch wheel + triton alone exceed this budget.
  #
  # Fix: redirect the "torch-gpu" named index to the CPU wheel server for all
  # CI jobs via UV_INDEX_TORCH_GPU.  Downstream consumers running on GPU hosts
  # omit this variable and continue to receive CUDA wheels from the cu130 index.
  #
  # Cache strategy: persist only $UV_CACHE_DIR (downloaded wheel archives).
  # Do NOT cache .venv — extracting from the wheel cache is fast (~30 s) and
  # avoids the cache-serialisation phase that itself hits the disk quota.
  # ---------------------------------------------------------------------------

  # --- uv installation ---
  UV_VERSION: "latest"

  # --- uv cache location (project-relative, included in GitLab cache) ---
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"

  # --- index override: redirect "torch-gpu" to CPU wheel server in CI ---
  # uv resolves UV_INDEX_<NAME_UPPER> where hyphens become underscores.
  # CPU wheels do not include triton, saving ~1.5 GB per job.
  UV_INDEX_TORCH_GPU: "https://download.pytorch.org/whl/cpu"

  # --- disable progress bars (cleaner CI logs) ---
  UV_NO_PROGRESS: "1"

  # --- never use the system Python; always use uv-managed interpreter ---
  UV_PYTHON_PREFERENCE: "only-managed"

  # ------------------------------------------------------------------------
  # --- CONFIGURATION (.env)
  # ------------------------------------------------------------------------

  # --- uv `--env-file` option ---
  UV_ENV_FILE: "$[[ inputs.gd-dotenv-file ]]"


cache:
  policy: pull-push
  # key:
  #   files:
  #     - pyproject.toml
  #     - uv.lock
  # paths:
  #   - .cache/uv

# --------------------------------------------------------------------
# NOTE:
#
#  CI_COMMIT_REF_PROTECTED is verified
#  only if CI_COMMIT_TAG is a "Protected Tag"
#  (Settings/Repository/Protected Tags)
#
#  see: https://claude.ai/share/caef5831-2efa-49ac-ac70-38dd6d05809f
#
# --------------------------------------------------------------------

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_COMMIT_MESSAGE =~ /^WIP.*/
      when: never
    - if: $CI_COMMIT_REF_PROTECTED != "true"
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_REF_PROTECTED == "true"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# ---------------------------------------------------------------------------
# Context Rules
# ---------------------------------------------------------------------------

.ctx-pipeline-debug:
  interruptible: true
  rules:
    - if: '"$[[ inputs.gd-debug-pipeline ]]" != "1"'
      when: never
    - when: always

.ctx-default-config:
  interruptible: true
  rules:
    - if: '"$[[ inputs.gd-dotenv-has-config ]]" == "1"'
      when: never
    - when: on_success  

.ctx-external-config:
  interruptible: true
  rules:
    - if: '"$[[ inputs.gd-dotenv-has-config ]]" != "1"'
      when: never
    - when: on_success  

.ctx-develop:
  interruptible: true
  rules:
    - if: '$CI_PROJECT_PATH != "$[[ inputs.gd-downstream-project ]]"'
      when: never
    - if: >-
       "$[[ inputs.gd-downstream-project-head ]]" !=  $CI_COMMIT_BRANCH &&
       "$[[ inputs.gd-downstream-project-head ]]" !=  $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME
      when: never
    - when: on_success  

.ctx-develop-py:
  extends:
    - .ctx-develop
  rules:
    - if: '"$[[ inputs.gd-lang-op-python ]]" != "1"'
      when: never
    - !reference [.ctx-develop, rules]


.ctx-release-tag:
  interruptible: false
  rules:
    - if: '"$[[ inputs.gd-release-op-upstream-merge ]]" != "1"'
      when: never
    - if: '$CI_COMMIT_TAG !~ /$[[ inputs.gd-version-schema ]]/'
      when: never

.ctx-release-downstream:
  extends:
    - .ctx-release-tag
  environment:
    name: staging
  rules:
    - !reference [.ctx-release-tag, rules]
    - if: '$CI_PROJECT_PATH != "$[[ inputs.gd-downstream-project ]]"'
      when: never
    - when: on_success  

.ctx-merge-upstream:
  environment:
    name: staging
  rules:
    - if: '$CI_PROJECT_PATH != "$[[ inputs.gd-upstream-project ]]"'
      when: never
    - if: >-
       "$[[ inputs.gd-upstream-project-main ]]" !=  $CI_COMMIT_BRANCH &&
       "$[[ inputs.gd-upstream-project-main ]]" !=  $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME
      when: never
    - when: on_success  

.ctx-release-upstream:
  extends:
    - .ctx-release-tag
  environment:
    name: production
  rules:
    - !reference [.ctx-release-tag, rules]
    - if: '$CI_PROJECT_PATH != "$[[ inputs.gd-upstream-project ]]"'
      when: never
    - when: on_success  

.ctx-merge-upstream-py:
  extends:
    - .ctx-merge-upstream
  rules:
    - if: '"$[[ inputs.gd-lang-op-python ]]" != "1"'
      when: never
    - !reference [.ctx-merge-upstream, rules]
    
.ctx-release-image:
  extends:
    - .ctx-release-upstream
  rules:
    - if: '"$[[ inputs.gd-release-op-upstream-image ]]" != "1"'
      when: never
    - !reference [.ctx-release-upstream, rules]


# -----------------------------------------------------------------------------
# Base Images
# -----------------------------------------------------------------------------

.gitlab-api-base:
  image: alpine:3.20
  variables:
    GIT_STRATEGY: none
  before_script:
    - apk add --no-cache curl jq

.git-base:
  image: alpine/git:2.45.2
  before_script:
    - apk add --no-cache curl jq

.git-full:
  image: alpine:3.20
  before_script:
    - apk add --no-cache curl jq git

.podman-base:
  image: quay.io/podman/stable:v5

.uv-validate-base:
  image: python:$[[ inputs.gd-python-version ]]-slim
  variables:
    UV_CACHE_DIR: "${CI_PROJECT_DIR}/.cache/uv"
  cache:
    # Only the uv download cache is persisted.  .venv is intentionally excluded.
    key: "uv-${CI_COMMIT_REF_SLUG}"
    # files:
    #   - pyproject.toml
    #   - uv.lock
    paths:
      - .cache/uv
  before_script:
    - echo "#__uv:init__"
    - df -h
    - apt-get update -qq
    - apt-get install -y --no-install-recommends ca-certificates curl git
    - rm -rf /var/lib/apt/lists/*
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - export PATH="$HOME/.local/bin:$PATH"

.uv-validate-lint:
  extends:
    - .uv-validate-base
  before_script:
    - !reference [.uv-validate-base, before_script]
    # Lint jobs operate on source text only.
    # --only-group dev  : install ruff and its peers; skip main dependencies.
    # --no-install-project : do not install the project package itself.
    # Result: no torch, no torchvision, no triton, minimal disk use (~150 MB).
    - uv sync --only-group dev --no-install-project
    - df -h

.uv-validate-check:
  extends:
    - .uv-validate-base
  before_script:
    - !reference [.uv-validate-base, before_script]
    - uv sync --group dev
    - df -h

.uv-validate-test:
  extends:
    - .uv-validate-base
  before_script:
    - !reference [.uv-validate-base, before_script]
    # pyright requires all project imports to be resolvable, so main deps
    # (including CPU torch) must be present.  UV_INDEX_TORCH_GPU redirects
    # the cu130 index to the CPU wheel server; triton is not a dep of CPU torch.
    - uv sync --group dev
    - df -h

.uv-validate-build:
  extends:
    - .uv-validate-base
  before_script:
    - !reference [.uv-validate-base, before_script]
    # setup for for hatchling builder with wheels support 
    - uv sync --group dev
    - df -h




# ===============================================================================
# Common: CONFIGURATION: .env configuration repository
# -------------------------------------------------------------------------------
# - parallel private configuration repo clone, relative to project (../conf)
# - can be customized by environment (development, testing, staging, production)
# - if not enabled, `.env` uv default to `.env.default` (versioned file)
# ===============================================================================

config-int:
  stage: .pre
  extends:
    - .ctx-default-config
    - .git-full
  script:
    - cp "$[[ inputs.gd-dotenv-default ]]" "$[[ inputs.gd-dotenv-file ]]" || true
    - cat "$[[ inputs.gd-dotenv-file ]]" | grep '^[a-zA-Z0-9_]' > "$[[ inputs.gd-dotenv-strict ]]"
  artifacts:
    reports:
      dotenv: "$[[ inputs.gd-dotenv-strict ]]"
    paths:
      - "$[[ inputs.gd-dotenv-file ]]"
      
.config-ext:
  stage: .pre
  extends:
    - .ctx-external-config
    - .git-full
  rules:
    - !reference [.ctx-external-config, rules]
  script:
    - export CONFIG_REF="$[[ inputs.gd-dotenv-config-branch ]]"
    - git clone --branch "$CONFIG_REF" "$[[ inputs.gd-dotenv-config-url ]]" $[[ inputs.gd-dotenv-config-path ]]
    - export CONFIG_ENV="envs/$[[ inputs.environment ]]"/.env
    - export CONFIG_FILE="$[[ inputs.gd-dotenv-config-path ]]/$CONFIG_ENV"
    - if [ ! -f "$CONFIG_FILE" ] ; then export CONFIG_FILE="$[[ inputs.gd-dotenv-config-path ]]/.env"; fi
    - cp "$CONFIG_FILE" "$[[ inputs.gd-dotenv-file ]]" || true
    - cat "$[[ inputs.gd-dotenv-file ]]" | grep '^[a-zA-Z0-9_]' > "$[[ inputs.gd-dotenv-strict ]]"
  artifacts:
    reports:
      dotenv: "$[[ inputs.gd-dotenv-strict ]]"
    paths:
      - "$[[ inputs.gd-dotenv-file ]]"
      - "$[[ inputs.gd-dotenv-config-path ]]"

config-ext-development:
  stage: .pre
  extends:
    - .config-ext
    - .ctx-develop
  rules:
    - !reference [.config-ext, rules]
    - !reference [.ctx-develop, rules]

config-ext-staging:
  stage: .pre
  extends:
    - .config-ext
    - .ctx-release-downstream
  rules:
    - !reference [.config-ext, rules]
    - !reference [.ctx-release-downstream, rules]

config-ext-production:
  stage: .pre
  extends:
    - .config-ext
    - .ctx-release-upstream
  rules:
    - !reference [.config-ext, rules]
    - !reference [.ctx-release-upstream, rules]


# ===============================================================================
# Common: CI/CD DEBUG: dump Pipeline environment
# ===============================================================================

debug-pipeline:
  stage: debug
  extends:
    - .ctx-pipeline-debug
    - .uv-validate-lint
  script:
    - echo "#__gitlab-ci:DEBUG__"
    - echo "#__gitlab-ci:debug(sh.env)__"
    - env | sort
    - echo "#__gitlab-ci:debug(uv.venv)__"
    - uv tree --show-sizes
    - uv pip list
    - du -sh .venv
    - df -h
    - echo "#__gitlab-ci:debug(uv.env)__"
    - ls -la .env*
    - uv run bash -c env | sort



# ===============================================================================
# Pipeline: VALIDATION: downstream head only
# -------------------------------------------------------------------------------
# - after feature branch merge-request commit
# - befere head -> main MR (blocking)
# ===============================================================================

# ---------------------------------------------------------------------------
# Stage: lint (downstream head only)
# ---------------------------------------------------------------------------

linting-py:
  stage: lint
  extends:
    - .ctx-develop-py
    - .uv-validate-lint
  script:
    - uv run ruff check

formatting-py:
  stage: lint
  extends:
    - .ctx-develop-py
    - .uv-validate-lint
  script:
    - uv run ruff format --check

licensing:
  stage: lint
  extends:
    - .ctx-develop
    - .uv-validate-lint
  script:
    - uv run reuse lint

typing-py:
  stage: lint
  extends:
    - .ctx-develop-py
    - .uv-validate-check
  script:
    - uv run pyright

# ---------------------------------------------------------------------------
# Stage: test (downstream head only)
# ---------------------------------------------------------------------------

testing-py:
  stage: test
  extends:
    - .ctx-develop-py
    - .uv-validate-test
  script:
    - uv run pytest -v


# ---------------------------------------------------------------------------
# Stage: building (downstream head only)
# ---------------------------------------------------------------------------

building-py:
  stage: build
  extends:
    - .ctx-develop-py
    - .uv-validate-build
  script:
    - uv build
    - ls -l dist
    - du -sh  dist


# ===============================================================================
# Pipeline: RELEASE: downstream main + upstream main
# -------------------------------------------------------------------------------
# - after downstram main annotated version tag commit
# - forward downstram main -> upstream main MR
# ===============================================================================

# -----------------------------------------------------------------------------
# Stage: release #validation (upstream only)
# -----------------------------------------------------------------------------

merge-checks-py:
  stage: merge
  extends:
    - .ctx-merge-upstream-py
    - .uv-validate-check
  script:
    - uv run ruff check
    - uv run ruff format --check
    - uv run pyright

merge-licence:
  stage: merge
  extends:
    - .ctx-merge-upstream
    - .uv-validate-check
  script:
    - uv run reuse lint

merge-tests-py:
  stage: merge
  extends:
    - .ctx-merge-upstream-py
    - .uv-validate-test
  script:
    - uv run pytest -v
    # - uv run pytest -v --cov

merge-build-py:
  stage: merge
  extends:
    - .ctx-merge-upstream-py
    - .uv-validate-build
  script:
    - uv build
    - ls -l dist
    - du -s dist

# -----------------------------------------------------------------------------
# Stage: release #merge-request (downstream only) - upstream MR create
# -----------------------------------------------------------------------------

# Project scope    : downstream only
# Trigger condition: tag *.*.* (workflow:rules) AND downstream project path
# Required vars    : GS_UPSTREAM_TOKEN
create-merge-request:
  extends:
    - .ctx-release-downstream
    - .gitlab-api-base
  stage: merge
  # dependencies:
  #   - release-checks-py
  #   - release-tests-py
  #   - release-build-py
  script:
    - |
      UPSTREAM_PROJECT_ID=$(curl --silent --show-error --fail \
        --header "PRIVATE-TOKEN: ${GS_UPSTREAM_TOKEN}" \
        "${CI_API_V4_URL}/projects/${UPSTREAM_PROJECT_PATH_ENCODED}" | jq -r .id)

      echo "Resolved upstream project id: ${UPSTREAM_PROJECT_ID}"

      RESPONSE=$(curl --silent --show-error --fail \
        --request POST \
        --header "PRIVATE-TOKEN: ${GS_DOWNSTREAM_TOKEN}" \
        --data-urlencode "source_branch=${MR_SOURCE_BRANCH}" \
        --data-urlencode "target_branch=${MR_TARGET_BRANCH}" \
        --data-urlencode "target_project_id=${UPSTREAM_PROJECT_ID}" \
        --data-urlencode "title=Release ${CI_COMMIT_TAG}: sync downstream to upstream main" \
        --data-urlencode "description=Automated release MR for tag ${CI_COMMIT_TAG}. Source: ${CI_PROJECT_PATH}@${CI_COMMIT_SHA}." \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests")

      MR_IID=$(echo "${RESPONSE}" | jq -r '.iid // empty')
      if [ -z "${MR_IID}" ]; then
        echo "Failed to create merge request:"
        echo "${RESPONSE}" | jq .
        exit 1
      fi

      echo "Created MR !${MR_IID} on upstream project ${UPSTREAM_PROJECT_ID}"
      echo "MR_IID=${MR_IID}" >> mr.env
      echo "UPSTREAM_PROJECT_ID=${UPSTREAM_PROJECT_ID}" >> mr.env
  artifacts:
    reports:
      dotenv: mr.env

# -----------------------------------------------------------------------------
# Stage: release #merge-request (downstream only) - upstream MR merge + tag
# -----------------------------------------------------------------------------

# Project scope    : downstream only (ub-dems/dve-simple-py)
# Trigger condition: tag v*.*.* (workflow:rules) AND downstream project path;
#                    MANUAL (see "Stage 3 approval gate" above)
# Required vars    : GS_UPSTREAM_TOKEN
trigger-upstream-merge-and-tag:
  extends:
    - .ctx-release-downstream
    - .gitlab-api-base
  stage: merge
  needs:
    - job: create-merge-request
      artifacts: true
  dependencies:
    - create-merge-request
  script:
    - |
      echo "Waiting for the upstream validation pipeline on MR !${MR_IID} ..."
      PIPELINE_STATUS="none"
      for i in $(seq 1 60); do
        MR_JSON=$(curl --silent --show-error --fail \
          --header "PRIVATE-TOKEN: ${GS_UPSTREAM_TOKEN}" \
          "${CI_API_V4_URL}/projects/${UPSTREAM_PROJECT_ID}/merge_requests/${MR_IID}")
        PIPELINE_STATUS=$(echo "${MR_JSON}" | jq -r '.head_pipeline.status // "none"')
        echo "  upstream pipeline status: ${PIPELINE_STATUS}"
        [ "${PIPELINE_STATUS}" = "success" ] && break
        if [ "${PIPELINE_STATUS}" = "failed" ] || [ "${PIPELINE_STATUS}" = "canceled" ]; then
          echo "Upstream validation pipeline did not succeed. Aborting."
          exit 1
        fi
        sleep 30
      done
      if [ "${PIPELINE_STATUS}" != "success" ]; then
        echo "Timed out waiting for the upstream validation pipeline."
        exit 1
      fi

      curl --silent --show-error --fail \
        --request PUT \
        --header "PRIVATE-TOKEN: ${GS_UPSTREAM_TOKEN}" \
        --data-urlencode "should_remove_source_branch=false" \
        --data-urlencode "merge_commit_message=Release ${CI_COMMIT_TAG}" \
        "${CI_API_V4_URL}/projects/${UPSTREAM_PROJECT_ID}/merge_requests/${MR_IID}/merge"

      echo "Waiting for the merge to complete ..."
      MR_STATE="unknown"
      for i in $(seq 1 20); do
        MR_JSON=$(curl --silent --show-error --fail \
          --header "PRIVATE-TOKEN: ${GS_UPSTREAM_TOKEN}" \
          "${CI_API_V4_URL}/projects/${UPSTREAM_PROJECT_ID}/merge_requests/${MR_IID}")
        MR_STATE=$(echo "${MR_JSON}" | jq -r .state)
        if [ "${MR_STATE}" = "merged" ]; then
          MERGE_COMMIT_SHA=$(echo "${MR_JSON}" | jq -r .merge_commit_sha)
          break
        fi
        sleep 15
      done
      if [ "${MR_STATE}" != "merged" ]; then
        echo "Merge request was not merged in time."
        exit 1
      fi

      echo "Tagging upstream main at ${MERGE_COMMIT_SHA} as ${CI_COMMIT_TAG}"
      curl --silent --show-error --fail \
        --request POST \
        --header "PRIVATE-TOKEN: ${GS_UPSTREAM_TOKEN}" \
        --data-urlencode "tag_name=${CI_COMMIT_TAG}" \
        --data-urlencode "ref=${MERGE_COMMIT_SHA}" \
        --data-urlencode "message=Release ${CI_COMMIT_TAG}" \
        "${CI_API_V4_URL}/projects/${UPSTREAM_PROJECT_ID}/repository/tags"

# -----------------------------------------------------------------------------
# Stage: release #publish (unstream only) - podman build + save
# -----------------------------------------------------------------------------

# Project scope    : upstream only
# Trigger condition: tag *.*.* (workflow:rules) AND upstream project path;
#                    this run starts because the tag above was created on the
#                    upstream project via the API in the previous stage
# Required vars    : none
build-base-images:
  stage: release
  extends:
    - .ctx-release-image
    - .podman-base
  needs: []
  dependencies: []
  parallel:
    matrix:
      # Placeholder identifiers — replace with the real image names produced
      # by scripts/build-images.sh (see "Additional notes" below).
      - IMAGE_NAME: ["anchor", "cuda", "base", "runtime"]
  script:
    - build.sh image "${IMAGE_NAME}"
    - mkdir -p images
    - podman save -o "images/${IMAGE_NAME}.tar" "localhost/${IMAGE_NAME}:${CI_COMMIT_TAG}"
  artifacts:
    paths:
      - "images/${IMAGE_NAME}.tar"
    expire_in: "1 day"

# -----------------------------------------------------------------------------
# Stage: image-push (upstream only)
# -----------------------------------------------------------------------------

# Project scope    : upstream only (ub-dems-public/dve-simple-py)
# Trigger condition: tag v*.*.* (workflow:rules) AND upstream project path;
#                    runs only if every build-image matrix job succeeded
# Required vars    : REGISTRY_URL, REGISTRY_USER, REGISTRY_PASSWORD
push-base-images:
  stage: release
  extends:
    - .ctx-release-image
    - .podman-base
  needs:
    - job: build-base-images
      artifacts: true
  dependencies:
    - build-base-images
  script:
    - podman login -u "${REGISTRY_USER}" -p "${REGISTRY_PASSWORD}" "${REGISTRY_URL}"
    - |
      for IMAGE_NAME in anchor, cuda, base, runtime; do
        podman load -i "images/${IMAGE_NAME}.tar"
        podman push "localhost/${IMAGE_NAME}:${CI_COMMIT_TAG}" \
          "${REGISTRY_URL}/${IMAGE_NAME}:${CI_COMMIT_TAG}"
      done


# =============================================================================
# .gitlab-ci.yml
#
# Shared release pipeline for the dve-simple-py codebase.
# This exact file lives in both projects:
#   - ub-dems/dve-simple-py        (private downstream fork, branches main/development)
#   - ub-dems-public/dve-simple-py (public upstream, branch main)
#
# The pipeline is tag-triggered (v*.*.*) and splits into two cooperating
# pipeline RUNS in two different projects:
#   1. Downstream validates, opens the release MR, and (on manual approval)
#      merges + tags upstream.
#   2. Creating that tag on upstream via the API starts a SECOND, independent
#      pipeline in the upstream project, which builds, pushes, mirrors, and
#      notifies.
# =============================================================================
---
spec:
  inputs:
    gd-release-op-upstream-merge:
      default: '1'
    gd-release-op-upstream-image:
      default: '0'
    gd-release-op-upstream-notify:
      default: '0'
    gd-develop-op-downstream-check-on-commit:
      default: '0'
    gd-develop-op-downstream-check-on-merge:
      default: '1'
    gd-downstream-project:
      default: "ub-dems/vs-base/dve-sample-py"
    gd-upstream-project:
      default: "ub-dems/ds-labs/dve-sample-py"
    gd-upstream-project-enc:
      default: "ub-dems%2Fds-labs%2Fdve-sample-py"
    gd-downstream-project-head:
      default: "develop"
    gd-downstream-project-main:
      default: "main"
    gd-upstream-project-main:
      default: "main"
    gd-version-schema:
      default: '^\d+\.\d+\.\d+(.+)?$'
    gd-python-version:
      default: '3.14'
    gd-image-names:
      default: "anchor,cuda,base,runtime"
    gd-image-prefix:
      default: 'ubdems'
    gd-dotenv-file:
      default: '.env'
    gd-dotenv-strict:
      default: '.env.exported'
    gd-dotenv-default:
      default: '.env.defaults'
    gd-dotenv-has-config:
      default: '0'
    gd-dotenv-config-url:
      default: "https://gitlab.com/ub-dems/vs-base/dve-sample-py-conf.git"
    gd-dotenv-config-branch:
      default: "main"
    gd-dotenv-config-path:
      default: "../conf"
    gd-lang-op-python:
      default: '1'
    gd-trace-pipeline:
      default: '1'
    gd-debug-pipeline:
      default: '0'
    environment:
      options:
        - development
        - testing
        - staging
        - production
      default: development
---

stages:

  # .pre
  - config
  - debug
  
  # downstream
  - lint
  - test
  - build

  # downstream (tag)
  - merge
  
  # upstream - (tag) trigger
  - check
  - commit
  
  # upstream (tag)
  - package
  - release
  - publish


default:
  # see: https://docs.gitlab.com/ci/runners/hosted_runners/linux/
  tags:
    - saas-linux-small-amd64
    # - saas-linux-medium-amd64
    # - saas-linux-large-amd64
    # - saas-linux-xlarge-amd64
    # - saas-linux-2xlarge-amd64
    # - saas-linux-medium-amd64-gpu-standard

  image: python:$[[ inputs.gd-python-version ]]-slim
  # CUDA images:
  # - nvcr.io/nvidia/cuda:12.1.1-base-ubuntu22.04
  # - https://youtu.be/tElegG4NCZ0?si=ZRk01nBHpLjKjoeB


variables:

  # ---------------------------------------------------------------------------
  # SECRETS (CI/CD only)
  # ---------------------------------------------------------------------------
  # The following are pre-configured project CI/CD variables
  # and are intentionally NOT redeclared here:
  #
  # = GitLab API ==============================
  # - GS_DOWNSTREAM_TOKEN
  # - GS_UPSTREAM_TOKEN
  #
  # = Podman Public Registry ==============================
  # - GS_REGISTRY_URL
  # - GS_REGISTRY_USER
  # - GS_REGISTRY_PASSWORD
  #
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # DOTENV (CI/CD + Local Development + Application Runtime)
  # ---------------------------------------------------------------------------
  # The following are .env variables taken from:
  #
  # 1. "Internal Mode": .env-defaults:
  #    if local resources or resources with external auth (Azure)
  #
  # 2. "External Mode": ../conf/.env:
  #     with parallel ckeckout of a (private) configuration project
  #
  # = Podman Private Registry (Azure) ==============================
  # - ACR_RESOURCE
  # - ACR_REGISTRY
  #
  # ---------------------------------------------------------------------------


  # ---------------------------------------------------------------------------
  # VARIABLES (inputs)
  # ---------------------------------------------------------------------------
  # Non-sensitive defaults only.
  #
  # ---------------------------------------------------------------------------
  
  DOWNSTREAM_PROJECT_PATH: "$[[ inputs.gd-downstream-project ]]"
  UPSTREAM_PROJECT_PATH: "$[[ inputs.gd-upstream-project ]]"
  UPSTREAM_PROJECT_PATH_ENCODED: "$[[ inputs.gd-upstream-project-enc ]]"
  MR_SOURCE_BRANCH: "$[[ inputs.gd-downstream-project-main ]]"
  MR_TARGET_BRANCH: "$[[ inputs.gd-upstream-project-main ]]"
  GIT_DEPTH: "0"

  GD_IMAGE_NAMES: "$[[ inputs.gd-image-names ]]"
  GD_IMAGE_PREFIX: "$[[ inputs.gd-image-prefix ]]/$CI_PROJECT_NAME."
  
  GD_TRACE: "$[[ inputs.gd-trace-pipeline ]]"
  GD_DEBUG: "$[[ inputs.gd-debug-pipeline ]]"



  # ---------------------------------------------------------------------------
  # Disk-budget notes
  # ---------------------------------------------------------------------------
  # GitLab SaaS shared runners carry a 20 GB working-directory quota.
  # The CUDA-bundled torch wheel + triton alone exceed this budget.
  #
  # Fix: redirect the "torch-gpu" named index to the CPU wheel server for all
  # CI jobs via UV_INDEX_TORCH_GPU.  Downstream consumers running on GPU hosts
  # omit this variable and continue to receive CUDA wheels from the cu130 index.
  #
  # Cache strategy: persist only $UV_CACHE_DIR (downloaded wheel archives).
  # Do NOT cache .venv — extracting from the wheel cache is fast (~30 s) and
  # avoids the cache-serialisation phase that itself hits the disk quota.
  # ---------------------------------------------------------------------------

  # --- uv installation ---
  UV_VERSION: "latest"

  # --- uv cache location (project-relative, included in GitLab cache) ---
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"

  # --- index override: redirect "torch-gpu" to CPU wheel server in CI ---
  # uv resolves UV_INDEX_<NAME_UPPER> where hyphens become underscores.
  # CPU wheels do not include triton, saving ~1.5 GB per job.
  # UV_INDEX_TORCH_GPU: "https://download.pytorch.org/whl/cpu"
  
  X_UV_EXTRA: "cpu"

  # --- disable progress bars (cleaner CI logs) ---
  UV_NO_PROGRESS: "1"

  # --- never use the system Python; always use uv-managed interpreter ---
  UV_PYTHON_PREFERENCE: "only-managed"

  # ------------------------------------------------------------------------
  # --- CONFIGURATION (.env)
  # ------------------------------------------------------------------------

  # --- uv `--env-file` option ---
  UV_ENV_FILE: "$[[ inputs.gd-dotenv-file ]]"


cache:
  policy: pull-push
  # key:
  #   files:
  #     - pyproject.toml
  #     - uv.lock
  # paths:
  #   - .cache/uv

# --------------------------------------------------------------------
# NOTE:
#
#  CI_COMMIT_REF_PROTECTED is verified
#  only if CI_COMMIT_TAG is a "Protected Tag"
#  (Settings/Repository/Protected Tags)
#
#  see: https://claude.ai/share/caef5831-2efa-49ac-ac70-38dd6d05809f
#
# --------------------------------------------------------------------

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_COMMIT_MESSAGE =~ /^WIP.*/
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "pipeline"
    - if: $CI_COMMIT_REF_PROTECTED != "true"
      when: never
    - if: $CI_COMMIT_TAG
    # - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
    #   when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_REF_PROTECTED == "true"
    - if: $CI_COMMIT_BRANCH

# ---------------------------------------------------------------------------
# Context Rules
# ---------------------------------------------------------------------------

.ctx-pipeline-debug:
  interruptible: true
  rules:
    - if: '"$[[ inputs.gd-debug-pipeline ]]" != "1"'
      when: never
    - when: always

.ctx-default-config:
  interruptible: true
  rules:
    - if: '"$[[ inputs.gd-dotenv-has-config ]]" == "1"'
      when: never
    - when: on_success  

.ctx-external-config:
  interruptible: true
  rules:
    - if: '"$[[ inputs.gd-dotenv-has-config ]]" != "1"'
      when: never
    - when: on_success  

.ctx-develop:
  interruptible: true
  rules:
    - if: '$CI_PROJECT_PATH != "$[[ inputs.gd-downstream-project ]]"'
      when: never
    - if: >-
       "$[[ inputs.gd-downstream-project-head ]]" !=  $CI_COMMIT_BRANCH &&
       "$[[ inputs.gd-downstream-project-head ]]" !=  $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME
      when: never
    - if: >-
       "$[[ inputs.gd-develop-op-downstream-check-on-commit ]]" !=  "1" &&
       $CI_PIPELINE_SOURCE == "push"
      when: never
    - if: >-
       "$[[ inputs.gd-develop-op-downstream-check-on-merge ]]" !=  "1" &&
       $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - when: on_success  

.ctx-develop-py:
  extends:
    - .ctx-develop
  rules:
    - if: '"$[[ inputs.gd-lang-op-python ]]" != "1"'
      when: never
    - !reference [.ctx-develop, rules]


.ctx-release-tag:
  interruptible: false
  rules:
    - if: '"$[[ inputs.gd-release-op-upstream-merge ]]" != "1"'
      when: never
    - if: '$CI_COMMIT_TAG !~ /$[[ inputs.gd-version-schema ]]/'
      when: never

.ctx-merge-downstream:
  extends:
    - .ctx-release-tag
  environment:
    name: staging
  rules:
    - !reference [.ctx-release-tag, rules]
    - if: '$CI_PROJECT_PATH != "$[[ inputs.gd-downstream-project ]]"'
      when: never
    - when: on_success  

.ctx-merge-upstream:
  interruptible: false
  environment:
    name: staging
  rules:
    - if: '$CI_PROJECT_PATH != "$[[ inputs.gd-upstream-project ]]"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: >-
       $CI_PIPELINE_SOURCE != "pipeline" &&
       $MERGE_SYNC_TRIGGER != "1"
      when: never
    - when: on_success

.ctx-commit-upstream:
  interruptible: false
  environment:
    name: staging
  rules:
    - if: '$CI_PROJECT_PATH != "$[[ inputs.gd-upstream-project ]]"'
      when: never
    # - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: >-
       $CI_PIPELINE_SOURCE != "pipeline" &&
       $MERGE_SYNC_TRIGGER != "1"
      when: never
    - when: on_success
    

.ctx-release-upstream:
  extends:
    - .ctx-release-tag
  environment:
    name: production
  rules:
    - !reference [.ctx-release-tag, rules]
    - if: '$CI_PROJECT_PATH != "$[[ inputs.gd-upstream-project ]]"'
      when: never
    - when: on_success  

.ctx-merge-upstream-py:
  extends:
    - .ctx-merge-upstream
  rules:
    - if: '"$[[ inputs.gd-lang-op-python ]]" == "-1"'
      when: never
    - !reference [.ctx-merge-upstream, rules]
    


.ctx-release-upstream-py:
  extends:
    - .ctx-release-upstream
  environment:
    name: production
  rules:
    - if: '"$[[ inputs.gd-lang-op-python ]]" == "-1"'
      when: never
    - !reference [.ctx-release-upstream, rules]
    
.ctx-release-image:
  extends:
    - .ctx-release-upstream
  rules:
    - if: '"$[[ inputs.gd-release-op-upstream-image ]]" != "1"'
      when: never
    - !reference [.ctx-release-upstream, rules]


# -----------------------------------------------------------------------------
# Base Images
# -----------------------------------------------------------------------------

.gitlab-api-base:
  image: alpine:3.20
  variables:
    GIT_STRATEGY: none
  before_script:
    - apk add --no-cache curl jq

.git-base:
  image: alpine/git:2.45.2
  before_script:
    - apk add --no-cache curl jq

.git-full:
  image: alpine:3.20
  before_script:
    - apk add --no-cache curl jq git

.podman-base:
  image: quay.io/podman/stable:v5
  before_script:
    - df -h
    - podman info

.uv-validate-base:
  image: python:$[[ inputs.gd-python-version ]]-slim
  variables:
    UV_CACHE_DIR: "${CI_PROJECT_DIR}/.cache/uv"
  cache:
    # Only the uv download cache is persisted.  .venv is intentionally excluded.
    key: "uv-${CI_COMMIT_REF_SLUG}"
    # files:
    #   - pyproject.toml
    #   - uv.lock
    paths:
      - .cache/uv
  before_script:
    - echo "#__uv:init__"
    - df -h
    - apt-get update -qq
    - apt-get install -y --no-install-recommends ca-certificates curl git
    - rm -rf /var/lib/apt/lists/*
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - export PATH="$HOME/.local/bin:$PATH"

.uv-validate-lint:
  extends:
    - .uv-validate-base
  before_script:
    - !reference [.uv-validate-base, before_script]
    # Lint jobs operate on source text only.
    # --only-group dev  : install ruff and its peers; skip main dependencies.
    # --no-install-project : do not install the project package itself.
    # Result: no torch, no torchvision, no triton, minimal disk use (~150 MB).
    - uv sync --only-group dev --no-install-project
    - df -h

.uv-validate-check:
  extends:
    - .uv-validate-base
  before_script:
    - !reference [.uv-validate-base, before_script]
    - uv sync --group dev --extra="$X_UV_EXTRA"
    - df -h

.uv-validate-test:
  extends:
    - .uv-validate-base
  before_script:
    - !reference [.uv-validate-base, before_script]
    # pyright requires all project imports to be resolvable, so main deps
    # (including CPU torch) must be present.  UV_INDEX_TORCH_GPU redirects
    # the cu130 index to the CPU wheel server; triton is not a dep of CPU torch.
    - uv sync --group dev --extra="$X_UV_EXTRA"
    - df -h

.uv-validate-build:
  extends:
    - .uv-validate-base
  before_script:
    - !reference [.uv-validate-base, before_script]
    # setup for for hatchling builder with wheels support 
    - uv sync --group dev --extra="$X_UV_EXTRA"
    - df -h




# ===============================================================================
# Common: CONFIGURATION: .env configuration repository
# -------------------------------------------------------------------------------
# - parallel private configuration repo clone, relative to project (../conf)
# - can be customized by environment (development, testing, staging, production)
# - if not enabled, `.env` uv default to `.env.default` (versioned file)
# ===============================================================================

config-int:
  stage: .pre
  extends:
    - .ctx-default-config
    - .git-full
  script:
    - cp "$[[ inputs.gd-dotenv-default ]]" "$[[ inputs.gd-dotenv-file ]]" || true
    - cat "$[[ inputs.gd-dotenv-file ]]" | grep '^[a-zA-Z0-9_]' > "$[[ inputs.gd-dotenv-strict ]]"
  artifacts:
    reports:
      dotenv: "$[[ inputs.gd-dotenv-strict ]]"
    paths:
      - "$[[ inputs.gd-dotenv-file ]]"
      
.config-ext:
  stage: .pre
  extends:
    - .ctx-external-config
    - .git-full
  rules:
    - !reference [.ctx-external-config, rules]
  script:
    - export CONFIG_REF="$[[ inputs.gd-dotenv-config-branch ]]"
    - git clone --branch "$CONFIG_REF" "$[[ inputs.gd-dotenv-config-url ]]" $[[ inputs.gd-dotenv-config-path ]]
    - export CONFIG_ENV="envs/$[[ inputs.environment ]]"/.env
    - export CONFIG_FILE="$[[ inputs.gd-dotenv-config-path ]]/$CONFIG_ENV"
    - if [ ! -f "$CONFIG_FILE" ] ; then export CONFIG_FILE="$[[ inputs.gd-dotenv-config-path ]]/.env"; fi
    - cp "$CONFIG_FILE" "$[[ inputs.gd-dotenv-file ]]" || true
    - cat "$[[ inputs.gd-dotenv-file ]]" | grep '^[a-zA-Z0-9_]' > "$[[ inputs.gd-dotenv-strict ]]"
  artifacts:
    reports:
      dotenv: "$[[ inputs.gd-dotenv-strict ]]"
    paths:
      - "$[[ inputs.gd-dotenv-file ]]"
      - "$[[ inputs.gd-dotenv-config-path ]]"

config-ext-development:
  stage: .pre
  extends:
    - .config-ext
    - .ctx-develop
  rules:
    - !reference [.config-ext, rules]
    - !reference [.ctx-develop, rules]

config-ext-staging:
  stage: .pre
  extends:
    - .config-ext
    - .ctx-merge-downstream
  rules:
    - !reference [.config-ext, rules]
    - !reference [.ctx-merge-downstream, rules]

config-ext-production:
  stage: .pre
  extends:
    - .config-ext
    - .ctx-release-upstream
  rules:
    - !reference [.config-ext, rules]
    - !reference [.ctx-release-upstream, rules]


# ===============================================================================
# Common: CI/CD DEBUG: dump Pipeline environment
# ===============================================================================

debug-pipeline:
  stage: debug
  extends:
    - .ctx-pipeline-debug
    - .uv-validate-test
  script:
    - echo "#__gitlab-ci:DEBUG__"
    - echo "#__gitlab-ci:debug(sh.env)__"
    - env | sort
    - echo "#__gitlab-ci:debug(uv.venv)__"
    - uv tree --group=dev --show-sizes
    - uv pip list
    - du -sh .venv
    - df -h
    - echo "#__gitlab-ci:debug(uv.env)__"
    - ls -la .env*
    - uv run bash -c env | sort



# ===============================================================================
# Pipeline: VALIDATION: downstream head only
# -------------------------------------------------------------------------------
# - after feature branch merge-request commit
# - befere head -> main MR (blocking)
# ===============================================================================

# ---------------------------------------------------------------------------
# Stage: lint (downstream head only)
# ---------------------------------------------------------------------------

linting-py:
  stage: lint
  extends:
    - .ctx-develop-py
    - .uv-validate-lint
  script:
    - uv run ruff check

formatting-py:
  stage: lint
  extends:
    - .ctx-develop-py
    - .uv-validate-lint
  script:
    - uv run ruff format --check

licensing-all:
  stage: lint
  extends:
    - .ctx-develop
    - .uv-validate-lint
  script:
    - uv run reuse lint

typing-py:
  stage: lint
  extends:
    - .ctx-develop-py
    - .uv-validate-check
  script:
    - uv run pyright

# ---------------------------------------------------------------------------
# Stage: test (downstream head only)
# ---------------------------------------------------------------------------

testing-py:
  stage: test
  extends:
    - .ctx-develop-py
    - .uv-validate-test
  script:
    - uv run pytest -v


# ---------------------------------------------------------------------------
# Stage: building (downstream head only)
# ---------------------------------------------------------------------------

building-py:
  stage: build
  extends:
    - .ctx-develop-py
    - .uv-validate-build
  script:
    - uv build
    - ls -lh dist
    - du -sh  dist


# ===============================================================================
# Pipeline: RELEASE - stages: merge (D), check (U), package (U), release (U)
# -------------------------------------------------------------------------------
# - after downstram main annotated version tag commit: `gd-version-schema`
# - forward downstream main [^1] -> upstream main create MR, from downstream
# - no upstream pipeline [^2] -> upstream main MR merge, from downstream
# - after upstream merge -> upstream release tag, from downstream
# - after upstream tag -> upstream release publish, from upstream
#
# [^1]: see: "Require a commit SHA on the merge requests API"
#  - https://docs.gitlab.com/user/group/manage/#require-a-commit-sha-on-the-merge-requests-api
#
# [^2]: see: https://claude.ai/share/fb5c11c1-a3bb-4dc3-bd38-1d82c178d969
# ===============================================================================


# -----------------------------------------------------------------------------
# Stage: merge #merge-request (downstream only) - upstream MR create
# -----------------------------------------------------------------------------
# Project scope    : downstream only
# Trigger condition: tag *.*.* (workflow:rules) AND downstream project path
# Required vars    : GS_UPSTREAM_TOKEN, GS_DOWNSTREAM_TOKEN

create-merge-request:
  extends:
    - .ctx-merge-downstream
    - .gitlab-api-base
  stage: merge
  script:
    - |
      if [ "$GD_TRACE" = "1" ]; then
         echo "TRC:> Upstream Project Request (GET ${CI_API_V4_URL}/projects/${UPSTREAM_PROJECT_PATH_ENCODED}"
      fi
      
      UPSTREAM_PROJECT_ID=$(curl --silent --show-error --fail \
        --header "PRIVATE-TOKEN: ${GS_UPSTREAM_TOKEN}" \
        "${CI_API_V4_URL}/projects/${UPSTREAM_PROJECT_PATH_ENCODED}" | jq -r .id)

      if [ "$GD_TRACE" = "1" ]; then
         echo "TRC:< Upstream Project Request (GET ${CI_API_V4_URL}/projects/${UPSTREAM_PROJECT_PATH_ENCODED}"
         echo "TRC:< UPSTREAM_PROJECT_ID=${UPSTREAM_PROJECT_ID}"
      fi
      
      echo "Resolved upstream project id: ${UPSTREAM_PROJECT_ID}"

      if [ "$GD_TRACE" = "1" ]; then
         echo "TRC:> Merge Request (POST ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests)"
         echo "TRC:> Merge Request Args:"
         echo "TRC:> - source_branch=${MR_SOURCE_BRANCH}"
         echo "TRC:> - target_branch=${MR_TARGET_BRANCH}"
         echo "TRC:> - target_project_id=${UPSTREAM_PROJECT_ID}"
         echo "TRC:> - title=Release ${CI_COMMIT_TAG}: sync downstream to upstream main"
         echo "TRC:> - description=Automated release MR for tag ${CI_COMMIT_TAG}. Source: ${CI_PROJECT_PATH}@${CI_COMMIT_SHA}."
      fi
      
      RESPONSE=$(curl --silent --show-error --fail \
        --request POST \
        --header "PRIVATE-TOKEN: ${GS_DOWNSTREAM_TOKEN}" \
        --data-urlencode "source_branch=${MR_SOURCE_BRANCH}" \
        --data-urlencode "target_branch=${MR_TARGET_BRANCH}" \
        --data-urlencode "target_project_id=${UPSTREAM_PROJECT_ID}" \
        --data-urlencode "title=Release ${CI_COMMIT_TAG}: sync downstream to upstream main" \
        --data-urlencode "description=Automated release MR for tag ${CI_COMMIT_TAG}. Source: ${CI_PROJECT_PATH}@${CI_COMMIT_SHA}." \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests")

      if [ "$GD_TRACE" = "1" ]; then
         echo "TRC:< Merge Response (POST ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests)"
         echo "$RESPONSE" | jq .
      fi
      
      MR_IID=$(echo "${RESPONSE}" | jq -r '.iid // empty')
      if [ -z "${MR_IID}" ]; then
        echo "Failed to create merge request:"
        echo "${RESPONSE}" | jq .
        exit 1
      fi

      echo "Created MR !${MR_IID} on upstream project ${UPSTREAM_PROJECT_ID}"
      echo "MR_IID=${MR_IID}" >> mr.env
      echo "UPSTREAM_PROJECT_ID=${UPSTREAM_PROJECT_ID}" >> mr.env
  artifacts:
    reports:
      dotenv: mr.env

# -----------------------------------------------------------------------------
# Stage: merge #merge-request (downstream only) - trigger upstream merge
# -----------------------------------------------------------------------------
# Project scope    : downstream only (ub-dems/dve-simple-py)
# Trigger condition: tag *.*.* (workflow:rules) AND downstream project path;
# Required vars    : GS_UPSTREAM_TOKEN
# Required auth    : CI_JOB_TOKEN
#
# [^1]: see: "CI/CD Settings - Job token permissions"

trigger-upstream-sync:
  extends:
    - .ctx-merge-downstream
  stage: merge
  needs:
    - job: create-merge-request
      artifacts: true
  trigger:
    project: "$[[ inputs.gd-upstream-project ]]"
    branch: "$[[ inputs.gd-upstream-project-main ]]"
    strategy: depend
  variables:
    MERGE_SYNC_TRIGGER: "1"
    MR_IID: $MR_IID
    RELEASE_TAG: $CI_COMMIT_TAG
    SOURCE_PROJECT_ID: $CI_PROJECT_ID    
    # GS_SOURCE_API_TOKEN: $GS_DOWNSTREAM_TOKEN


# -----------------------------------------------------------------------------
# Stage: check #validation (upstream only)
# -----------------------------------------------------------------------------

check-lint-py:
  stage: check
  extends:
    - .ctx-merge-upstream-py
    - .uv-validate-check
  script:
    - uv run ruff check
    - uv run ruff format --check
    - uv run pyright

check-licence-all:
  stage: check
  extends:
    - .ctx-merge-upstream
    - .uv-validate-check
  script:
    - uv run reuse lint

check-tests-py:
  stage: check
  extends:
    - .ctx-merge-upstream-py
    - .uv-validate-test
  script:
    - uv run pytest -v
    # - uv run pytest -v --cov

check-build-py:
  stage: check
  extends:
    - .ctx-merge-upstream
    - .uv-validate-build
  script:
    - uv build
    - ls -l dist
    - du -s dist

check-gate:
  stage: check
  extends:
    - .ctx-merge-upstream
    - .gitlab-api-base
  needs:
    - job: check-licence-all
    - job: check-lint-py
    - job: check-tests-py
    - job: check-build-py
  script:
    - echo "#__gitlab-ci:CECK__"
    - echo "#__gitlab-ci:check(sh.env)__"
    - env | sort
    - date


# -----------------------------------------------------------------------------
# Stage: merge #merge-request (upstream only) - trigger: MERGE_SYNC_TRIGGER
# -----------------------------------------------------------------------------
# Project scope    : upstream only
# Trigger condition: MERGE_SYNC_TRIGGER AND upstream project path;
# Required vars    : GS_UPSTREAM_TOKEN

upstream-merge-and-tag:
  stage: commit
  extends:
    - .ctx-commit-upstream
    - .gitlab-api-base
  needs:
    - job: check-gate
  script:
    - |

      echo "#commit(tag:${RELEASE_TAG}):>> Merging MR !${MR_IID} in ${CI_PROJECT_PATH}"

      echo "Inspecting MR !${MR_IID} in ${CI_PROJECT_PATH}"

      if [ "$GD_TRACE" = "1" ]; then
         echo "TRC:> MR Status Request (GET ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${MR_IID})"
      fi

      MR_JSON=$(curl --silent --show-error --fail \
        --header "PRIVATE-TOKEN: ${GS_UPSTREAM_TOKEN}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${MR_IID}")

      if [ "$GD_TRACE" = "1" ]; then
         echo "TRC:< MR Status Response (GET ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${MR_IID})"
         echo "$MR_JSON" | jq .
      fi

      MR_STATE=$(echo "$MR_JSON" | jq -r .state)
      TARGET_BRANCH=$(echo "$MR_JSON" | jq -r .target_branch)
      CHANGES_COUNT=$(echo "$MR_JSON" | jq -r '.changes_count // "unknown"')

      if [ "$MR_STATE" = "merged" ]; then
        echo "MR already merged (idempotent re-run); reusing merge_commit_sha"
        MERGE_COMMIT_SHA=$(echo "$MR_JSON" | jq -r .merge_commit_sha)

      elif [ "$CHANGES_COUNT" = "0" ]; then
        echo "MR has no diff vs ${TARGET_BRANCH}: nothing to merge, treating as in-sync."

        if [ "$GD_TRACE" = "1" ]; then
           echo "TRC:> Get MAIN head commit Request (GET ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/repository/branches/${TARGET_BRANCH})"
        fi

        MERGE_COMMIT_SHA=$(curl --silent --show-error --fail \
          --header "PRIVATE-TOKEN: ${GS_UPSTREAM_TOKEN}" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/repository/branches/${TARGET_BRANCH}" \
          | jq -r .commit.id)

        if [ "$GD_TRACE" = "1" ]; then
           echo "TRC:< Get MAIN head commit Request (GET ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/repository/branches/${TARGET_BRANCH})"
           echo "TRC:< MERGE_COMMIT_SHA=$MERGE_COMMIT_SHA"
        fi

      else

        if [ "$GD_TRACE" = "1" ]; then
           echo "TRC:> Merge Request (PUT ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${MR_IID}/merge)"
           echo "TRC:> Merge Request Args:"
           echo "TRC:> - should_remove_source_branch=false"
           echo "TRC:> - merge_commit_message=Release ${RELEASE_TAG}"
        fi

        HTTP_CODE=$(curl --silent --show-error \
          --request PUT \
          --header "PRIVATE-TOKEN: ${GS_UPSTREAM_TOKEN}" \
          --data-urlencode "should_remove_source_branch=false" \
          --data-urlencode "merge_commit_message=Release ${RELEASE_TAG}" \
          --output merge_response.json \
          --write-out "%{http_code}" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${MR_IID}/merge")

        if [ "$GD_TRACE" = "1" ]; then
           echo "TRC:< Merge Response (PUT ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${MR_IID}/merge)"
           echo "TRC:< HTTP $HTTP_CODE"
           cat merge_response.json | jq .
        fi
        
        if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ]; then
          echo "Merge rejected (HTTP $HTTP_CODE): $(jq -r '.message // .' merge_response.json)"
          exit 1
        fi

        MR_STATE=$(jq -r .state merge_response.json)
        MERGE_COMMIT_SHA=$(jq -r .merge_commit_sha merge_response.json)

        # Bounded retry for GitLab's own async-merge worker (merge trains,
        # very large diffs). This is a real internal eventual-consistency
        # wait, not a stand-in for a pipeline that will never exist.
        i=0
        while [ "${MR_STATE}" != "merged" ] && [ "$i" -lt 10 ]; do
          sleep 2
          
          if [ "$GD_TRACE" = "1" ]; then
             echo "TRC:> Merge Status Request (GET ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${MR_IID}):"
          fi
          
          MR_JSON=$(curl --silent --show-error --fail \
            --header "PRIVATE-TOKEN: ${GS_UPSTREAM_TOKEN}" \
            "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${MR_IID}")

          if [ "$GD_TRACE" = "1" ]; then
             echo "TRC:< Merge Status Response (GET ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${MR_IID}):"
             echo "$MR_JSON" | jq .
          fi

          MR_STATE=$(echo "$MR_JSON" | jq -r .state)
          MERGE_COMMIT_SHA=$(echo "$MR_JSON" | jq -r .merge_commit_sha)
          echo "$i: waiting for MR($MR_IID): MR_STATE=$MR_STATE"
          i=$((i+1))
        done
        [ "${MR_STATE}" = "merged" ] || { echo "Merge did not complete"; exit 1; }
      fi

      echo "#commit(tag:${RELEASE_TAG}):<< Merged MR !${MR_IID}  in ${CI_PROJECT_PATH}"
      echo "#commit(tag:${RELEASE_TAG}):>> Tagging tag:${RELEASE_TAG} at ${MERGE_COMMIT_SHA}"

      echo "Tagging ${CI_PROJECT_PATH} at ${MERGE_COMMIT_SHA} as ${RELEASE_TAG}"

      if [ "$GD_TRACE" = "1" ]; then
         echo "TRC:> Tag Request (POST ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/repository/tags)"
         echo "TRC:> Tag Request Args:"
         echo "TRC:> - tag_name=${RELEASE_TAG}"
         echo "TRC:> - ref=${MERGE_COMMIT_SHA}"
         echo "TRC:> - message=Release: ${RELEASE_TAG}"
      fi

      MR_JSON=$(curl --silent --show-error --fail \
        --request POST \
        --header "PRIVATE-TOKEN: ${GS_UPSTREAM_TOKEN}" \
        --data-urlencode "tag_name=${RELEASE_TAG}" \
        --data-urlencode "ref=${MERGE_COMMIT_SHA}" \
        --data-urlencode "message=Release ${RELEASE_TAG}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/repository/tags")


      if [ "$GD_TRACE" = "1" ]; then
         echo "TRC:< Tag Response (POST ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/repository/tags)"
         echo "$MR_JSON" | jq .
      fi

      echo "#commit(tag:${RELEASE_TAG}):>> #TAG(upstream) ${CI_PROJECT_PATH} at ${MERGE_COMMIT_SHA} as ${RELEASE_TAG}"





upstream-merge-and-tag:
  stage: commit
  extends:
    - .ctx-commit-upstream
    - .gitlab-api-base
  needs:
    - job: check-gate
  script:
    - |
      echo "#commit(tag:${RELEASE_TAG}):>> Merging MR !${MR_IID} in ${CI_PROJECT_PATH}"

      if [ "$GD_TRACE" = "1" ]; then
         echo "TRC:> MR Status Request (GET ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${MR_IID})"
      fi

      MR_JSON=$(curl --silent --show-error --fail \
        --header "PRIVATE-TOKEN: ${GS_UPSTREAM_TOKEN}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${MR_IID}")

      if [ "$GD_TRACE" = "1" ]; then
         echo "TRC:< MR Status Response"
         echo "$MR_JSON" | jq .
      fi

      MR_STATE=$(echo "$MR_JSON" | jq -r .state)
      TARGET_BRANCH=$(echo "$MR_JSON" | jq -r .target_branch)
      MERGE_STATUS=$(echo "$MR_JSON" | jq -r '.detailed_merge_status // .merge_status // "unknown"')
      CHANGES_COUNT=$(echo "$MR_JSON" | jq -r '.changes_count // empty')
      DIFF_BASE_SHA=$(echo "$MR_JSON" | jq -r '.diff_refs.base_sha // empty')
      DIFF_HEAD_SHA=$(echo "$MR_JSON" | jq -r '.diff_refs.head_sha // empty')

      # changes_count is lazily computed by GitLab and is routinely `null`
      # on a fresh MR whether or not there's a real diff — it cannot be
      # trusted alone. base_sha == head_sha is always present and is a
      # reliable proof the source has nothing new for the target.
      NO_CHANGES=false
      if [ "$CHANGES_COUNT" = "0" ]; then
        NO_CHANGES=true
      elif [ -n "$DIFF_BASE_SHA" ] && [ "$DIFF_BASE_SHA" = "$DIFF_HEAD_SHA" ]; then
        NO_CHANGES=true
      fi

      echo "MR_STATE=${MR_STATE} MERGE_STATUS=${MERGE_STATUS} CHANGES_COUNT=${CHANGES_COUNT:-null} NO_CHANGES=${NO_CHANGES}"

      if [ "$MR_STATE" = "merged" ]; then
        echo "MR already merged (idempotent re-run); reusing merge_commit_sha"
        MERGE_COMMIT_SHA=$(echo "$MR_JSON" | jq -r .merge_commit_sha)

      elif [ "$NO_CHANGES" = "true" ]; then
        echo "MR has no diff vs ${TARGET_BRANCH} (base_sha == head_sha): nothing to merge, treating as in-sync."

        if [ "$GD_TRACE" = "1" ]; then
           echo "TRC:> Get target branch head (GET ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/repository/branches/${TARGET_BRANCH})"
        fi

        MERGE_COMMIT_SHA=$(curl --silent --show-error --fail \
          --header "PRIVATE-TOKEN: ${GS_UPSTREAM_TOKEN}" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/repository/branches/${TARGET_BRANCH}" \
          | jq -r .commit.id)

        echo "Closing no-op MR !${MR_IID} to free the source/target branch pair for the next release."

        if [ "$GD_TRACE" = "1" ]; then
           echo "TRC:> Close MR (PUT ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${MR_IID}, state_event=close)"
           echo "TRC:> Close MR  Request Args:"
           echo "TRC:> - state_event=close"
        fi

        MR_JSON=$(curl --silent --show-error --fail \
          --request PUT \
          --header "PRIVATE-TOKEN: ${GS_UPSTREAM_TOKEN}" \
          --data-urlencode "state_event=close" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${MR_IID}")

        if [ "$GD_TRACE" = "1" ]; then
           echo "TRC:> Close MR (PUT ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${MR_IID}, state_event=close)"
           echo "$MR_JSON" | jq .
        fi

        echo "MR !${MR_IID} closed."

      elif [ "$MERGE_STATUS" != "can_be_merged" ] && [ "$MERGE_STATUS" != "mergeable" ]; then
        # Real changes exist but GitLab won't merge them (conflict, CI gate,
        # approvals, ...). Don't attempt the PUT — it will just 405 again
        # with no useful detail — and don't touch the MR's state.
        echo "MR !${MR_IID} has changes but is not mergeable (status: ${MERGE_STATUS})."
        echo "Leaving MR open for manual resolution: ${CI_PROJECT_PATH}/-/merge_requests/${MR_IID}"
        exit 1

      else
        if [ "$GD_TRACE" = "1" ]; then
           echo "TRC:> Merge Request (PUT .../merge_requests/${MR_IID}/merge)"
           echo "TRC:> Merge Request Args:"
           echo "TRC:> - should_remove_source_branch=false"
           echo "TRC:> - merge_commit_message=Release ${RELEASE_TAG}"
        fi

        HTTP_CODE=$(curl --silent --show-error \
          --request PUT \
          --header "PRIVATE-TOKEN: ${GS_UPSTREAM_TOKEN}" \
          --data-urlencode "should_remove_source_branch=false" \
          --data-urlencode "merge_commit_message=Release ${RELEASE_TAG}" \
          --output merge_response.json \
          --write-out "%{http_code}" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${MR_IID}/merge")

        if [ "$GD_TRACE" = "1" ]; then
           echo "TRC:< Merge Response (PUT ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${MR_IID}/merge)"
           echo "TRC:< HTTP $HTTP_CODE"
           cat merge_response.json | jq .
        fi

        if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ]; then
          echo "Merge rejected (HTTP $HTTP_CODE): $(jq -r '.message // .' merge_response.json)"
          exit 1
        fi

        MR_STATE=$(jq -r .state merge_response.json)
        MERGE_COMMIT_SHA=$(jq -r .merge_commit_sha merge_response.json)

        i=0
        while [ "${MR_STATE}" != "merged" ] && [ "$i" -lt 10 ]; do
          sleep 2
          if [ "$GD_TRACE" = "1" ]; then
             echo "TRC:> Merge Status Request (GET ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${MR_IID}):"
          fi
          
          MR_JSON=$(curl --silent --show-error --fail \
            --header "PRIVATE-TOKEN: ${GS_UPSTREAM_TOKEN}" \
            "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${MR_IID}")
            
          if [ "$GD_TRACE" = "1" ]; then
             echo "TRC:< Merge Status Response (GET ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${MR_IID}):"
             echo "$MR_JSON" | jq .
          fi

          MR_STATE=$(echo "$MR_JSON" | jq -r .state)
          MERGE_COMMIT_SHA=$(echo "$MR_JSON" | jq -r .merge_commit_sha)
          echo "$i: waiting for MR($MR_IID): MR_STATE=$MR_STATE"
          i=$((i+1))
        done
        [ "${MR_STATE}" = "merged" ] || { echo "Merge did not complete"; exit 1; }
      fi

      echo "#commit(tag:${RELEASE_TAG}):<< Resolved MR !${MR_IID} at ${MERGE_COMMIT_SHA}"
      echo "#commit(tag:${RELEASE_TAG}):>> Tagging tag:${RELEASE_TAG} at ${MERGE_COMMIT_SHA}"

      if [ "$GD_TRACE" = "1" ]; then
         echo "TRC:> Tag Request (POST ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/repository/tags)"
         echo "TRC:> Tag Request Args:"
         echo "TRC:> - tag_name=${RELEASE_TAG}"
         echo "TRC:> - ref=${MERGE_COMMIT_SHA}"
         echo "TRC:> - message=Release: ${RELEASE_TAG}"
      fi

      MR_JSON=$(curl --silent --show-error --fail \
        --request POST \
        --header "PRIVATE-TOKEN: ${GS_UPSTREAM_TOKEN}" \
        --data-urlencode "tag_name=${RELEASE_TAG}" \
        --data-urlencode "ref=${MERGE_COMMIT_SHA}" \
        --data-urlencode "message=Release ${RELEASE_TAG}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/repository/tags")

      if [ "$GD_TRACE" = "1" ]; then
         echo "TRC:< Tag Response (POST ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/repository/tags)"
         echo "$MR_JSON" | jq .
      fi

      echo "#commit(tag:${RELEASE_TAG}):>> #TAG(upstream) ${CI_PROJECT_PATH} at ${MERGE_COMMIT_SHA} as ${RELEASE_TAG}"



# -----------------------------------------------------------------------------
# Stage: package (unstream only) - uv build + save
# -----------------------------------------------------------------------------

package-build-py:
  stage: package
  extends:
    - .ctx-release-upstream
    - .uv-validate-build
  script:
    - uv build
    - ls -l dist
    - du -s dist
  artifacts:
    paths:
      - "dist"

package-gate:
  stage: package
  extends:
    - .ctx-release-upstream
    - .gitlab-api-base
  dependencies:
    - package-build-py
    # - package-build-images
  needs:
    - job: package-build-py
      artifacts: true
    # - job: package-build-images
    #   artifacts: true
  script:
    - echo "#__gitlab-ci:CECK__"
    - echo "#__gitlab-ci:check(sh.env)__"
    - env | sort
    - date
    - ls -la   dist
    - mkdir -p dist
    - ls -la   images
    - mkdir -p images
  artifacts:
    paths:
      - "dist"
      - "images"

# -----------------------------------------------------------------------------
# Stage: release (unstream only) - create gitlab release (optional)
# -----------------------------------------------------------------------------

release-collect:
  stage: release
  extends:
    - .ctx-release-upstream
    - .uv-validate-build
  dependencies:
    - package-gate
  needs:
    - job: package-gate
      artifacts: true
  script:
    - echo "#RELEASE($CI_COMMIT_TAG) -- MERGE_COMMIT_SHA=$MERGE_COMMIT_SHA"
    - ls -l dist
    - du -s dist
    - ls -l images
    - du -s images
  artifacts:
    paths:
      - "dist"
      - "images"



# -----------------------------------------------------------------------------
# Stage: package #images (upstream only) - podman build + save
# -----------------------------------------------------------------------------
# Project scope    : upstream only
# Trigger condition: tag *.*.* (workflow:rules) AND upstream project path;
# Required vars    : none

package-build-images:
  stage: package
  extends:
    - .ctx-release-image
    - .podman-base
  needs: []
  dependencies: []
  parallel:
    matrix:
      # Placeholder identifiers — replace with the real image names produced
      # by scripts/build-images.sh (see "Additional notes" below).
      - IMAGE_NAME: $[[ inputs.gd-image-names | split(',') ]]
  before_script:
    - !reference [.podman-base, before_script]
    - build.sh setup"
    - podman images
    - df -h
  script:
    - build.sh image "${IMAGE_NAME}" "$CI_COMMIT_TAG"
    - mkdir -p images
    - podman save -o "images/${IMAGE_NAME}.tar" "localhost/${IMAGE_NAME}:${CI_COMMIT_TAG}"
  artifacts:
    paths:
      - "images/${IMAGE_NAME}.tar"
    expire_in: "1 day"


# -----------------------------------------------------------------------------
# Stage: image-push (upstream only)
# -----------------------------------------------------------------------------
# Project scope    : upstream only (ub-dems-public/dve-simple-py)
# Trigger condition: tag *.*.* (workflow:rules) AND upstream project path;
# Required vars    : GS_REGISTRY_URL, GS_REGISTRY_USER, GS_REGISTRY_PASSWORD

publish-push-images:
  stage: publish
  extends:
    - .ctx-release-image
    - .podman-base
  dependencies:
    - package-build-images
    - release-collect
  needs:
    - job: package-build-images
      artifacts: true
    - job: release-collect
      artifacts: true
  script:
    - podman login -u "${GS_REGISTRY_USER}" -p "${GS_REGISTRY_PASSWORD}" "${GS_REGISTRY_URL}"
    - |
      IFS=',' read -ra images <<< "$[[ inputs.gd-image-names ]]"
      image_path="$[[ inputs.gd-image-prefix ]]/${CI_PROJECT_NAME}."
      for IMAGE_NAME in ${images[@]}; do
        echo "push image ${GS_REGISTRY_URL}/${image_path}${IMAGE_NAME}:${CI_COMMIT_TAG}, ..."
        
        podman load -i "images/${IMAGE_NAME}.tar"
        podman push "localhost/${image_path}${IMAGE_NAME}:${CI_COMMIT_TAG}" \
          "${GS_REGISTRY_URL}/${image_path}${IMAGE_NAME}:${CI_COMMIT_TAG}"
          
        echo "push image ${GS_REGISTRY_URL}/${image_path}${IMAGE_NAME}:${CI_COMMIT_TAG}, done"
      done

